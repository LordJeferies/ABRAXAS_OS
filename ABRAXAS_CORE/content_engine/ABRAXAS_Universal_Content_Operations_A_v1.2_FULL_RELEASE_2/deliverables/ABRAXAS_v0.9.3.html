function deepClone(v){return JSON.parse(JSON.stringify(v));}

  const parts=[];

function compileEditorialPrompt(content,client,inputs={}){
 const structure=(inputs.structure||content.structure||content.units||[]).map?.((x,i)=>typeof x==='string'?`${i+1}. ${x}`:`${i+1}. ${x.name||x.label}: ${x.function||''}`).join('\n')||'';
 return `ABRAXAS · PROMPT MAESTRO EDITORIAL · v0.9.3\nCONTENT_ID: ${content.id}\n\nROL\nActúa como director editorial senior, guionista y copywriter nativo de plataforma para ${client.name}. Tu trabajo no es proponer una idea: debes producir o regenerar una pieza final, operable y versionable dentro de ABRAXAS. Debes pensar con criterio de marca, audiencia, formato, evidencia, estructura, ritmo y distribución, y devolver un resultado que otra IA o editor pueda ejecutar sin conocer este chat.\n\nOBJETIVO\nCrear/actualizar “${content.title}” como ${physicalTypeLabel(inputs.physicalType||content.physicalType)}. Intención: ${inputs.intention||content.intention||'educar con criterio'}. Audiencia: ${inputs.audience||content.audience||'audiencia profesional relevante'}. Problema o tensión: ${inputs.problem||content.problem||content.summary||''}. Cambio buscado: ${inputs.desiredChange||content.desiredChange||'que la audiencia entienda una decisión y pueda actuar mejor'}. Plataforma principal: ${inputs.primaryPlatform||content.primaryPlatform||content.platforms?.[0]||'LinkedIn'}.\n\nJERARQUÍA DE CONTEXTO\n1) Hechos, fuentes y restricciones explícitas. 2) Brand Core/Branding Method aprobado. 3) Formato físico elegido. 4) Patrón del cliente y patrón universal seleccionados. 5) Audiencia, intención y problema. 6) Historial para evitar repetición. 7) Criterio creativo. Nunca uses creatividad para contradecir evidencia.\n\nBRAND CORE\n${brandSnapshot(client)}\n\nPATRONES\nPatrón cliente: ${inputs.recipeClient||content.recipeClient||content.formatName||'No seleccionado'}.\nPatrón universal: ${inputs.recipeUniversal||content.recipeUniversal||'No seleccionado'}.\nEl formato físico manda. Si un patrón fue adaptado desde otro formato, conserva su lógica pero escribe en lenguaje nativo de ${physicalTypeLabel(inputs.physicalType||content.physicalType)}. No imites una forma que no corresponde al output.\n\nESTRUCTURA EDITABLE\n${structure||unitsSnapshot(content)}\n\nEVIDENCIA Y CLAIMS\nFuentes/evidencia: ${inputs.evidence||content.evidence||'No se aportó evidencia adicional.'}\nClaims/restricciones: ${inputs.claims||content.claims||'No inventar cifras, resultados, citas, funcionalidades ni evidencia.'}\nCTA/cierre: ${inputs.cta||content.cta||'Cierre de criterio; CTA suave solo si la intención lo justifica.'}\n\nQUÉ ES\nUna pieza específica de ${client.name}, con hook, desarrollo y cierre causalmente conectados; cada unidad aporta información nueva; el copy amplía el contenido; la salida conserva content_id y puede volver al Production Graph.\n\nQUÉ NO ES\nNo es una plantilla universal renombrada. No es un brief. No es una lista de frases bonitas. No es una transcripción pegada. No es un carrusel que repite un reel. No es un texto inflado con sinónimos. No inventes datos, citas, fuentes, resultados, features o claims.\n\nCRITERIOS EDITORIALES\n- El hook debe abrir una tensión real que la pieza resuelva.\n- Cada unidad debe cumplir una función distinguible: contexto, mecanismo, contraste, evidencia, ejemplo, decisión o implicación.\n- El cierre debe pagar la promesa del hook y dejar una regla, decisión o siguiente acción.\n- Adapta longitud y sintaxis a la plataforma; no dupliques el mismo copy entre Instagram, LinkedIn, TikTok/Shorts, YouTube o Email.\n- Separa hecho, hipótesis, opinión y ejemplo. Marca REVIEW cuando la fuente no alcance.\n- Si una parte puede eliminarse sin perder sentido, reescríbela o elimínala.\n\nSALIDA EXACTA\nDevuelve JSON con contentId="${content.id}", title, summary, thesis, physicalType, clientPattern, universalPattern, structure[], units[] completos, copies por plataforma aplicable, promptInputs normalizados, prompts.editorial, prompts.visual, expectedAssets[], productionTaskResults[] y qa. Cada unidad debe incluir label/name, function, text, recording, visualDirection y relación con la unidad anterior/siguiente.\n\nQA\nAntes de responder verifica: especificidad de marca; formato físico correcto; progresión hook→desarrollo→cierre; ausencia de redundancia; copies nativos; claims sustentados o marcados; content_id intacto; importabilidad sin contexto oculto. Si algo falla, corrígelo antes de entregar.`;
}
function compileVisualPrompt(content,client,inputs={}){
 return `ABRAXAS · PROMPT MAESTRO VISUAL / PRODUCCIÓN · v0.9.3\nCONTENT_ID: ${content.id}\n\nROL\nActúa como director de arte, director audiovisual, editor senior y prompt designer para ${client.name}. Convierte la pieza “${content.title}” en un sistema visual producible, coherente y trazable. No estás decorando: cada visual debe mejorar comprensión, evidencia, ritmo, emoción o continuidad.\n\nOBJETIVO\nTraducir el contenido aprobado a decisiones visuales ejecutables por unidad sin cambiar tesis, claims ni función narrativa. El resultado debe especificar qué se graba, qué se genera, qué se preserva, qué asset vuelve a qué slot y cómo comprobar que la intervención mejora comprensión o retención.\n\nFORMATO Y CONTEXTO\nFormato físico: ${physicalTypeLabel(inputs.physicalType||content.physicalType)}. Tema: ${content.title}. Intención: ${inputs.intention||content.intention||''}. Audiencia: ${inputs.audience||content.audience||''}. Referencia visual opcional: ${inputs.visualReference||content.visualReference||'No aportada'}.\n\nIDENTIDAD DE MARCA\n${client.visualRules||client.brandCore?.identity||''}\nAccent de cliente: ${client.accent}. Usa el accent para foco/identidad, no para reemplazar colores semánticos de estados. Mantén una jerarquía visual tranquila: contenido primero, controles/ornamentos después.\n\nUNIDADES EDITORIALES\n${unitsSnapshot(content)}\n\nQUÉ ES\nUn Production Plan que un editor o IA puede ejecutar por unidad. Puede elegir presenter_only, source_video_enhancement, independent_broll, photo_broll, UI/diagram, generative_image o evidence_asset según función. Para carrusel, cada slide necesita composición, texto, prompt con texto y sin texto, continuidad y safe area. Para video, cada beat necesita grabación, B-roll/VFX opcional, SFX con sonido + momento + trigger y música con función.\n\nQUÉ NO ES\nNo es una lista de adjetivos como “cinematográfico/premium”. No obliga a poner VFX en todos los beats. No usa stock genérico intercambiable. No altera identidad, anatomía, lipsync, vestuario o perspectiva de una persona real al usar video fuente. No presenta ilustración generativa como evidencia real.\n\nREGLAS POR UNIDAD\n1. Define narrativeFunction y mode antes de diseñar.\n2. Describe escena/sujeto/objeto, composición, plano/lente si aporta, movimiento, luz, color/materiales, texto en pantalla, timing y transición.\n3. Source video: preservar identidad, lipsync, anatomía, cámara y temporalidad; especificar qué sí puede cambiar.\n4. Independent B-roll: duración, cámara, movimiento, start/middle/end y cómo conecta con el beat.\n5. Carrusel: promptWithText + promptWithoutText; layout, safe areas, jerarquía, negativos y continuidad.\n6. SFX: sound, when, trigger, level; si no hay evento justificable usar no_sfx_needed.\n7. Música: estilo, BPM aproximado, energía, entrada, ducking y resolución.\n8. Portada: dos opciones cuando aplique, una conceptual y otra con persona, ambas legibles en móvil.\n\nASSETS Y RUTAS\nUsa siempre assets/{client_id}/${content.id}/{asset_group}/{filename}. Vincula cada output al slot esperado. No inventes una ruta paralela.\n\nRESTRICCIONES\nNo logos inventados, manos/rostros deformes, texto extra, objetos incoherentes, glass decorativo excesivo, motion sin función ni evidencia ficticia. No romper continuidad de paleta, sujeto, iluminación o estilo entre unidades.\n\nSALIDA EXACTA\nDevuelve visualPlan[] con unitId, label, narrativeFunction, mode, scene, subjectObject, composition, camera, motion, lighting, colorMaterials, screenText, timing, transition, sfx, music, continuity, negatives, finalPrompt, referenceFrames(start,middle,end cuando aplique), assetSlotId, filename y relativePath.\n\nQA\nCada asset debe justificar su función, ser reproducible sin el chat, respetar identidad y rutas, distinguir evidencia de ilustración, y mantener continuidad. Si una intervención no mejora comprensión/retención, elige presenter_only.`;
}

function unitAssetSlot(content,index){const slots=content.expectedAssets||[];return slots[Math.min(index,Math.max(0,slots.length-1))]||{slotId:`unit-${index+1}`,relativePath:`assets/${content.clientId}/${content.id}/units/unit-${index+1}.png`,kind:'image'};}
function unitBaseContext(content,unit,index,client){const slot=unitAssetSlot(content,index);return `CONTENT_ID: ${content.id}\nUNIT_ID: ${unit.id||`u${index+1}`}\nUNIDAD: ${unit.label||unit.name||`Unidad ${index+1}`}\nFUNCIÓN: ${unit.function||''}\nTEXTO/IDEA: ${unit.text||''}\nFORMATO: ${physicalTypeLabel(content.physicalType)}\nCLIENTE: ${client.name}\nPILAR: ${content.pillar||''}\nPATRÓN: ${content.recipeClient||''}\nVISUAL PROFILE: ${client.visualRules||client.brandCore?.identity||''}\nDIRECCIÓN ACTUAL: ${unit.visualDirection||''}\nGRABACIÓN ACTUAL: ${unit.recording||''}\nB-ROLL ACTUAL: ${unit.broll||''}\nSLOT: ${slot.slotId}\nRUTA ESPERADA: ${slot.relativePath}`;}
function compileUnitOmniPrompt(content,unit,index,client){return `ABRAXAS · OMNI / SOURCE VIDEO ENHANCEMENT · v0.9.3\n\nROL\nActúa como supervisor de VFX, director de composición y prompt designer senior. Debes usar el fragmento de video original de esta unidad como SOURCE VIDEO obligatorio cuando exista. Tu intervención tiene que ampliar comprensión o retención sin cambiar la interpretación del speaker ni convertir el plano en una demo de efectos.\n\nOBJETIVO\nDiseñar una intervención Omni/VFX específica para la unidad ${index+1} de “${content.title}”. La intervención debe aparecer únicamente cuando una relación, mecanismo, interfaz, dato o contraste necesite apoyo visual. Si el speaker sostiene mejor la idea sin intervención, devuelve mode=presenter_only y explica por qué.\n\nCONTEXTO\n${unitBaseContext(content,unit,index,client)}\n\nQUÉ ES\nUna instrucción de source_video_enhancement con preservación explícita, placement espacial, timing, estados visuales y negativos. Puede incorporar overlays, UI, diagramas, profundidad, tracking, máscaras, parallax o elementos 3D ligeros solo cuando tengan función narrativa.\n\nQUÉ NO ES\nNo es un re-render del speaker. No sustituye rostro, labios, cuerpo, manos, piel, vestuario o locación. No cambia lipsync, cámara, lente aparente, exposición, perspectiva o temporalidad salvo corrección técnica explícita. No añade hologramas, partículas o texto decorativo por “verse futurista”. No presenta gráficos inventados como evidencia.\n\nPRESERVACIÓN OBLIGATORIA\nConserva identidad, anatomía, expresión, sincronía labial, movimiento corporal, manos, vestuario, tono de piel, relación sujeto-fondo, perspectiva, encuadre, movimiento de cámara y duración del source. Si un elemento cruza delante del speaker, especifica oclusión, máscara y profundidad sin cubrir ojos/boca/manos relevantes.\n\nINTERVENCIÓN\nNombre actual del efecto: ${unit.vfx?.name||'Contextual Materialize'}. Nivel simple: ${unit.vfx?.simple||'fade/scale sutil'}. Nivel medio: ${unit.vfx?.medium||'build secuencial/parallax leve'}. Nivel avanzado: ${unit.vfx?.advanced||'tracking/máscaras/profundidad solo si aporta'}. Describe qué elemento aparece, por qué, posición relativa al speaker, escala, anclaje, profundidad, iluminación/reflejos, motion blur, easing y relación con palabra/gesto.\n\nTIMING\nEntrega entrada, build, momento de máxima claridad y salida. La intervención debe nacer después de que la idea verbal sea comprensible y retirarse antes del siguiente beat salvo continuidad explícita. Define START / MIDDLE / END como tres estados de referencia coherentes.\n\nSFX Y CONTINUIDAD\nSFX actual: ${unit.sfx?.sound||'no_sfx_needed'}; WHEN: ${unit.sfx?.when||'solo con evento visual'}; TRIGGER: ${unit.sfx?.trigger||'evento visual real'}; LEVEL: ${unit.sfx?.level||'bajo voz'}. Mantén el lenguaje visual de ${client.name}; no introduzcas otro sistema a mitad de la pieza.\n\nSALIDA EXACTA\nDevuelve JSON con mode, objective, preservationRules[], effectName, spatialPlacement, occlusion, depth, lightingIntegration, motion, timing{in,build,peak,out}, referenceFrames{start,middle,end}, sfx{sound,when,trigger,level}, negatives[], finalOmniPrompt, assetSlotId y relativePath.\n\nQA\nComprueba identidad intacta, lipsync intacto, perspectiva intacta, evento visual justificado, timing sincronizado, SFX subordinado a voz, ausencia de evidencia ficticia y salida ejecutable sin conocer este chat.`;}
function compileUnitReferenceImagesPrompt(content,unit,index,client){return `ABRAXAS · REFERENCE FRAMES START / MIDDLE / END · v0.9.3\n\nROL\nActúa como director de arte y diseñador de keyframes para producción audiovisual. Debes generar tres imágenes de referencia coherentes que describan el inicio, el punto medio de máxima legibilidad y el final de una misma intervención o B-roll.\n\nOBJETIVO\nProducir START, MIDDLE y END para la unidad ${index+1} de “${content.title}”, de forma que estas referencias puedan subirse junto con el fragmento fuente a una herramienta de video o usarse como guía de edición manual. Las tres imágenes deben contar una sola acción/progresión, no tres conceptos distintos.\n\nCONTEXTO\n${unitBaseContext(content,unit,index,client)}\n\nQUÉ ES\nUn triptych temporal: START establece composición y estado inicial; MIDDLE muestra el punto donde el concepto visual se entiende mejor; END resuelve la acción y prepara el corte/transición siguiente. Deben compartir sujeto, locación, escala, lente aparente, dirección de luz, paleta, materiales y geometría.\n\nQUÉ NO ES\nNo son tres moodboards. No cambies identidad, vestuario, props, hora del día, perspectiva, encuadre o estilo entre frames. No introduzcas texto extra, logos inventados, datos no aportados ni elementos flotantes sin función. No uses una imagen “bonita” que no explique la idea.\n\nCOMPOSICIÓN Y CONTINUIDAD\nRespeta la dirección visual: ${unit.visualDirection||''}. Si es source video, conserva el frame base y describe solo la intervención. Si es independent B-roll, define sujeto/objeto, foreground/midground/background, punto focal, profundidad, escala y recorrido de cámara. Si es UI/diagrama, conserva layout, tipografía aproximada y posición de módulos entre los tres frames.\n\nESTADOS\nSTART: estado previo o primer 10–20% de la acción, con espacio para que el elemento empiece. MIDDLE: máxima claridad del mecanismo/relación, sin saturar la composición. END: acción resuelta, elementos asentados o saliendo, compatible con el siguiente beat.\n\nSALIDA EXACTA\nEntrega tres prompts separados "startPrompt", "middlePrompt", "endPrompt", más continuityRules[], cameraMotionSuggestion, transitionSuggestion, negatives[], assetSlotId y relativePath. Cada prompt debe ser autónomo y describir exactamente la misma escena en diferente estado temporal.\n\nQA\nVerifica continuidad estricta, utilidad para video real, ausencia de cambios accidentales, legibilidad del concepto y que MIDDLE sea realmente el frame más informativo.`;}
function compileUnitBrollPrompt(content,unit,index,client){return `ABRAXAS · INDEPENDENT B-ROLL VIDEO · v0.9.3\n\nROL\nActúa como director de fotografía, realizador de B-roll y prompt designer de video. Debes crear un apoyo audiovisual independiente que pueda insertarse sobre la voz sin repetir literalmente lo que el speaker dice.\n\nOBJETIVO\nDiseñar un B-roll específico para la unidad ${index+1} de “${content.title}” que clarifique contexto, mecanismo, evidencia, interfaz o consecuencia. Si no existe una visual concreta que aporte, devuelve presenter_only en vez de inventar stock genérico.\n\nCONTEXTO\n${unitBaseContext(content,unit,index,client)}\n\nQUÉ ES\nUn shot o microsecuencia de 3–8 segundos con función narrativa explícita. Puede usar laboratorio, producto, interfaz, documento, objeto, entorno, gesto, macro/micro, diagrama o proceso según la marca y el argumento. Define acción, cámara, movimiento, profundidad, iluminación y transición.\n\nQUÉ NO ES\nNo es stock “persona usando laptop”, manos escribiendo sin contexto, laboratorio genérico, dron aleatorio ni una metáfora intercambiable entre marcas. No inventes instalaciones, pantallas, resultados, prototipos o evidencia. Si una interfaz real no está disponible, etiqueta la propuesta como conceptual/reference.\n\nSHOT DESIGN\nDefine sujeto/objeto principal, acción exacta, encuadre, focal/lente aparente, altura/ángulo, movimiento (locked/pan/tilt/dolly/orbit/handheld solo si aporta), duración, velocidad, foreground/midground/background, textura, color y relación con la voz. Explica en qué palabra o subidea entra y qué debe haberse entendido cuando sale.\n\nSTART / MIDDLE / END\nSTART establece situación y dirección de movimiento; MIDDLE muestra el punto de máxima comprensión; END resuelve la acción y deja un frame fácil de cortar. Mantén continuidad total.\n\nMARCA\n${client.visualRules||''} El accent ${client.accent} puede aparecer como detalle de identidad, no como baño de color ni como estado semántico.\n\nSALIDA EXACTA\nDevuelve mode, narrativeFunction, shotDescription, duration, camera, lens, movement, lighting, colorMaterials, action, timingInVoice, startFrame, middleFrame, endFrame, transitionIn, transitionOut, negatives[], finalVideoPrompt, evidenceLabel y assetSlotId/relativePath.\n\nQA\nEl B-roll debe ser específico, producirse sin este chat, no fingir evidencia, no competir con la voz y justificar cada segundo que ocupa pantalla.`;}
function compileUnitStillPrompt(content,unit,index,client){return `ABRAXAS · PHOTO / STILL SUPPORT · v0.9.3\n\nROL\nActúa como director de arte y fotógrafo/editorial prompt designer. Tu trabajo es generar una imagen fija de apoyo o un key visual para la unidad ${index+1} de “${content.title}”.\n\nOBJETIVO\nCrear una imagen que explique o sostenga la función narrativa de la unidad, con composición suficientemente específica para que un diseñador pueda reproducirla o una IA de imagen pueda generarla sin interpretar vagamente adjetivos.\n\nCONTEXTO\n${unitBaseContext(content,unit,index,client)}\n\nQUÉ ES\nUna fotografía/ilustración/diagrama/UI still con sujeto, composición, jerarquía, luz, materiales, perspectiva, profundidad, espacio negativo, relación con texto y safe areas definidos. Debe responder a la idea del beat/slide, no únicamente “verse de marca”.\n\nQUÉ NO ES\nNo es stock genérico. No inventa evidencia, productos, laboratorios, dashboards, documentos, rostros o datos reales. No agrega texto no solicitado. No altera la identidad de una persona de referencia. No convierte el accent de cliente en un filtro de color dominante.\n\nDIRECCIÓN VISUAL\n${client.visualRules||client.brandCore?.identity||''}\nDirección específica: ${unit.visualDirection||''}. Define punto focal principal, ocupación aproximada del frame, alignment, foreground/midground/background, escala relativa, textura, iluminación, contraste, color/materiales y espacio donde viviría un titular si corresponde.\n\nUSO\nSi el asset es una referencia conceptual, etiquétalo como "illustrative_reference". Si es evidencia/asset real, no regeneres el dato: pide usar el archivo real. Si es imagen de carrusel sin texto, deja áreas limpias para composición posterior.\n\nSALIDA EXACTA\nDevuelve mode, subject, scene, composition, cameraPerspective, lighting, colorMaterials, negativeSpace, safeArea, textPlacementGuide, evidenceLabel, negatives[], finalImagePrompt, assetSlotId, filename y relativePath.\n\nQA\nDebe leerse bien a tamaño móvil, ser específica del cliente y contenido, distinguir ilustración de evidencia, no crear información nueva y mantener continuidad con las unidades vecinas.`;}
function compileUnitSfxPrompt(content,unit,index,client){return `ABRAXAS · SFX DESIGN / SEARCH BRIEF · v0.9.3\n\nROL\nActúa como sound designer y editor de audio senior. Diseña o describe con precisión un efecto de sonido breve que acompañe una acción visual concreta sin competir con la voz ni convertir la pieza en un trailer.\n\nOBJETIVO\nResolver el SFX de la unidad ${index+1} de “${content.title}”. Si no existe una animación, transición u objeto cuya acción justifique feedback sonoro, devuelve "no_sfx_needed" y explica la decisión.\n\nCONTEXTO\n${unitBaseContext(content,unit,index,client)}\nSFX actual: SOUND=${unit.sfx?.sound||'no_sfx_needed'}; WHEN=${unit.sfx?.when||'sin definir'}; TRIGGER=${unit.sfx?.trigger||'sin definir'}; LEVEL=${unit.sfx?.level||'bajo voz'}. VFX relacionado: ${unit.vfx?.name||'ninguno'}.\n\nQUÉ ES\nUn microevento sonoro sincronizado a un evento visual: click, tick, tactile pop, short whoosh, soft impact, mechanical snap, paper cue, UI confirm u otro timbre específico. Debe tener un comienzo claro, duración corta y dinámica compatible con diálogo.\n\nQUÉ NO ES\nNo es música, riser cinematográfico largo, bass drop, glitch gratuito ni sonido genérico colocado “porque hay movimiento”. No debe entrar antes del evento visual que representa. No debe tapar consonantes, finales de frase o respiraciones importantes.\n\nDISEÑO SONORO\nDefine familia/timbre, ataque, cuerpo, cola, rango frecuencial dominante, sensación material, duración aproximada, estéreo/mono, cantidad de grave permitida y tratamiento (reverb/delay/saturación) si aporta. Describe cuándo entra en frames o relación verbal, qué animación lo dispara y a qué nivel relativo debe mezclarse bajo la voz.\n\nSALIDA EXACTA\nDevuelve sound, when, trigger, level, duration, tonalCharacter, frequencyProfile, envelope, processing, placement, searchKeywords[], generationPrompt, negatives[] y qa. Si no aplica, devuelve sound="no_sfx_needed", triggerReason y no inventes un sonido alternativo.\n\nQA\nComprueba sincronía real, función narrativa, compatibilidad con voz, cola suficientemente corta y coherencia con el lenguaje editorial de ${client.name}.`;}
function compileCarouselSlidePrompt(content,unit,index,client,withText=true){return `ABRAXAS · CAROUSEL SLIDE ${withText?'WITH TEXT':'WITHOUT TEXT'} · v0.9.3\n\nROL\nActúa como director de arte editorial y diseñador de carruseles premium para ${client.name}. Debes producir el slide ${index+1}/${content.units.length} de “${content.title}” con continuidad estricta respecto del carrusel completo.\n\nOBJETIVO\nTraducir la función “${unit.function||''}” a una composición vertical 4:5 clara y legible. El slide debe avanzar la historia, no repetir el anterior. ${withText?('Incluye EXACTAMENTE este texto aprobado, sin añadir ni corregir palabras: “'+(unit.text||'')+'”.'):'No incluyas texto final renderizado; reserva la composición y safe areas para que el texto se añada después.'}\n\nCONTEXTO\n${unitBaseContext(content,unit,index,client)}\n\nQUÉ ES\nUna pieza editorial coherente con el sistema visual del cliente, con una idea visual dominante, jerarquía, grid, safe areas, relación texto-imagen, composición y continuidad definidos. Puede usar fotografía, objeto, macro/micro, diagrama, UI o abstracción siempre que la elección ayude a entender el contenido.\n\nQUÉ NO ES\nNo es un poster aislado ni un cambio de estilo entre slides. No inventes logos, datos, citas, productos, pantallas, estudios o resultados. No añadas texto adicional, badges o íconos decorativos no solicitados. No uses un collage saturado que compita con la idea central.\n\nSISTEMA VISUAL\n${client.visualRules||''}\nDirección de esta unidad: ${unit.visualDirection||''}. Mantén margen seguro aproximado de 9–12%, jerarquía móvil, contraste suficiente y continuidad de color/material/lente con slides vecinos. El accent ${client.accent} es un detalle de marca, no un fondo obligatorio.\n\nCOMPOSICIÓN\nDescribe fondo, sujeto/objeto, posición, escala, recorte, profundidad, zona de titular/cuerpo, dirección de lectura, iluminación, textura, elementos gráficos, balance de espacio negativo y cómo prepara el siguiente slide.\n\nSALIDA EXACTA\nDevuelve slideIndex, narrativeFunction, layout, headlineArea, bodyArea, imageArea, safeArea, subject, composition, lighting, colorMaterials, graphicElements, continuityRules[], negatives[], evidenceLabel, finalPrompt, assetSlotId, filename y relativePath.\n\nQA\nVerifica legibilidad móvil, texto ${withText?'exacto':'ausente'}, una sola idea dominante, continuidad, ausencia de invenciones y que el slide cumpla su función aunque se vea aislado.`;}
function buildBrandToolPrompt(client,driver,tool){return `ABRAXAS · BRANDING METHOD · ${String(tool.name).toUpperCase()} · v0.9.3\n\nROL\nActúa como estratega senior de branding, investigador cualitativo y analista de evidencia. Aplica ${tool.name} del ${driver.name} a ${client.name}. No redactes frases decorativas: produce una respuesta versionable que cambie decisiones reales de negocio, contenido, visual, ventas y experiencia.\n\nOBJETIVO\nResolver: ${tool.question}. La respuesta debe integrar información disponible del cliente, separar hechos de hipótesis y derivar implicaciones observables.\n\nQUÉ ES\n${tool.whatIs}\n\nQUÉ NO ES\n${tool.whatIsNot} No inventes competidores, audiencia, propósito, valores, resultados, claims ni evidencia. No confundas gusto visual con estrategia.\n\nCONTEXTO DEL CLIENTE\n${brandSnapshot(client)}\n\nPROCEDIMIENTO\n1. Separa hechos confirmados, señales, hipótesis y vacíos. 2. Explica la decisión concreta que resuelve la herramienta. 3. Formula respuesta específica usando evidencia. 4. Contrasta especificidad, diferenciación, utilidad decisional, coherencia y límites. 5. Deriva implicaciones comerciales, editoriales, visuales, experiencia y operaciones. 6. Declara exclusiones. 7. Asigna confidence y validationRequired. 8. Lista fuentes faltantes y preguntas de validación.\n\nSALIDA EXACTA\nJSON con toolId="${tool.toolId}", toolName, driverId="${driver.id}", decisionQuestion, answer, reasoningSummary, evidence[], confidence, validationRequired, implications{commercial,content,visual,experience,operations,risks}, is[], isNot[], examples[], exclusions[], sourceGaps[], validationQuestions[] y dependencies[].\n\nQA\nLa respuesta debe ser específica de ${client.name}, utilizable, no contradictoria, trazable, con límites explícitos y sin hechos inventados.`;}
function buildShimPrompt(cfg){return `ABRAXAS SHIM · EXTERNAL AI EDITORIAL REQUEST · v0.9.3

ROL
Actúa como editor audiovisual senior, estratega de contenido, curador de discurso, copywriter multiplataforma y arquitecto de un HTML editorial autocontenido. Lee la grabación completa antes de seleccionar. No eres un resumidor: conviertes material hablado en candidatos editables y trazables sin inventar palabras.

OBJETIVO
Transformar una transcripción larga con timestamps en un sistema editorial de candidatos de alta calidad: videos verticales/horizontales, carruseles complementarios, copies, planes de producción, prompts visuales y un Automation Handoff reproducible. El resultado debe permitir revisar pieza por pieza antes de producir o cortar el video original.

QUÉ ES
Shim es un compilador de solicitud: organiza la transcripción, configuración y criterios ABRAXAS dentro de un prompt para una IA externa. La fuente literal de cualquier frase hablada sigue siendo la transcripción y sus timestamps. Shim no corta el video por sí mismo en esta fase.

QUÉ NO ES
No es un resumidor, no reescribe el discurso para “mejorarlo”, no inventa hooks hablados, no corrige silenciosamente palabras, no reutiliza fragmentos prohibidos y no convierte una idea de la transcripción en una cita literal que nunca se dijo. Tampoco debe confundir un carrusel complementario con una transcripción del video.

FUENTE Y CONTEXTO
Video/archivo: ${cfg.sourceLabel||'Sin nombre'}. Contexto opcional: ${cfg.context||'No aportado; infiere temas solo desde la transcripción.'}

CONFIGURACIÓN
Verticales: ${cfg.verticalEnabled?'sí':'no'} · ${cfg.verticalCount||'auto'}. Horizontales: ${cfg.horizontalEnabled?'sí':'no'} · ${cfg.horizontalCount||'auto'}. Plataformas: ${(cfg.platforms||[]).join(', ')||'multiplataforma'}. Estructuras: ${(cfg.structures||[]).join(', ')||'distribución inteligente'}. Estructura personalizada: ${cfg.customStructure||'ninguna'}. Carruseles complementarios: ${cfg.carouselEnabled?'sí':'no'} · ${cfg.carouselCount||'auto'}.

REGLAS DE INTEGRIDAD
La transcripción y timestamps son la fuente literal para cualquier frase hablada. No arregles palabras dentro de una cita sin marcarlo. Cada clip debe indicar todos los segmentos/timestamps que lo componen; un mismo clip puede unir varios segmentos no contiguos si conserva coherencia y no altera sentido. Evita reutilizar el mismo fragmento cuando el usuario pide máximo de piezas sin repetición. Declara cualquier intervalo ambiguo o palabra dudosa en transcriptWarnings[].

CRITERIO DE SELECCIÓN
Hook claro, desarrollo con progresión, cierre/pago, idea autónoma, coherencia con segmentos vecinos, calidad verbal, novedad, valor para el pilar y retención. Vertical objetivo 50–80 s salvo material excepcional; horizontal 8–12 min cuando corresponda. Puntúa hook, coherence, retention, specificity, platformFit, transcriptIntegrity, timestampIntegrity y editability. transcriptIntegrity/timestampIntegrity <10 bloquean candidato.

PRODUCCIÓN
Por cada video: título interno, tema, pilar sugerido, criterio de selección, hook/development/closure, timestamps exactos, transcript literal, copies por plataforma, propuesta de portada conceptual + persona, guía de grabación/edición, B-roll/VFX por sub-bloque del desarrollo, SFX con sound+when+trigger+level, música, prompts Omni y prompts de tres imágenes START/MIDDLE/END para cada VFX/B-roll que lo necesite. El desarrollo se subdivide tantas veces como sea necesario para que un video largo no tenga un único apoyo genérico.

AUTOMATION HANDOFF
Devuelve un manifest que pueda convertirse en FFmpeg/Terminal/DaVinci: source, segments[{in,out,order}], assemblyMode, outputFormat, subtitles, filenames. Debe permitir exportar uno, varios o todos los candidatos; segmentos separados y master unido. No inventes in/out points que no estén respaldados por la transcripción.

CARRUSELES COMPLEMENTARIOS
Genera 4–14 según temas, sin repetir literalmente el video. Cada uno de 4 o 6 slides: hook en slide 1, desarrollo progresivo, cierre final; texto editable, visualDirection por slide, copy Instagram/TikTok/LinkedIn/YouTube, promptWithText y promptWithoutText. Cada carrusel debe ampliar, contrastar, sistematizar o aplicar el tema, no repetirlo con otras palabras.

HTML REQUERIDO
HTML autocontenido con dashboard, lista y Content Studio 1×1 para clips/carruseles; revisión, historial, editables, exportación por sección/lote; manifest de automatización; master JSON; assets/prompt slots; calendario sugerido. Debe ser comprensible sin conocer esta conversación.

TRANSCRIPCIÓN
${cfg.transcript||'[PENDIENTE: transcripción con timestamps]'}

SALIDA EXACTA
Devuelve: 1) editable_html completo; 2) master_json con candidates[], carousels[], discardedCandidates[], qualityGate, calendarSuggestion y automationHandoff; 3) manifests por video con timestamps; 4) copies por plataforma; 5) prompts visuales/start-middle-end; 6) SRT/TXT cuando pueda derivarse literalmente de los segmentos; 7) blockers/warnings. Conserva identificadores estables para que otra etapa pueda hidratar ABRAXAS.

QA
No ocultes limitaciones. Devuelve blockers, warnings, discardedCandidates con razón y qualityExhausted. Comprueba transcriptIntegrity=10 y timestampIntegrity=10 en candidatos aprobados, ausencia de frases inventadas, no repetición indebida, claridad del hook/desarrollo/cierre, carruseles complementarios reales, copies nativos y Automation Handoff ejecutable. El resultado debe poder volver a ABRAXAS sin crear IDs paralelos.`;}

 copy:`COPY / DISTRIBUCIÓN\n- Entrega copies realmente nativos por plataforma, no una misma pieza recortada.\n- Instagram/TikTok pueden abrir con tensión y contexto; LinkedIn debe desarrollar argumento/implicación; YouTube necesita título/description útiles; newsletter/email solo si aplica.\n- No copiar literalmente el guion/slides. No hashtags de relleno. CTA coherente con intención.`,

function makeTaskPrompt(content,task,client){return `ABRAXAS · PRODUCTION TASK · v0.9.3
CONTENT_ID: ${content.id}
TASK_ID: ${task.id}
TASK: ${task.label}

ROL
Actúa como especialista senior de producción para ${client.name}, con responsabilidad exclusiva sobre la tarea “${task.label}” dentro del mismo Content/Production Graph. Trabaja como si el resto de la pieza ya estuviera versionado y aprobado: toca solo lo necesario y conserva las decisiones que están fuera del alcance de esta tarea.

OBJETIVO
Resolver ${task.description} de forma ejecutable, trazable y suficientemente específica para que el resultado pueda volver a ABRAXAS sin contexto oculto. El entregable debe reducir un pendiente real de producción y sugerir el siguiente estado únicamente si la evidencia del propio contenido lo permite.

CONTEXTO
Pieza: ${content.title}. Formato físico: ${physicalTypeLabel(content.physicalType)}. Patrón: ${content.recipeClient||'no definido'}. Pilar: ${content.pillar}. Lote: ${content.lot}. Estado: ${content.lifecycle}. Plataformas: ${(content.platforms||[]).join(', ')||content.primaryPlatform||'no registradas'}. Resumen/tesis: ${content.summary||content.thesis||''}

ALCANCE ESPECÍFICO
${taskInstructions(task.type)}

QUÉ ES
Un entregable puntual que cierra o avanza una Production Task del content_id ${content.id}. Debe respetar Brand Core, formato físico, estructura, assets esperados y cualquier contenido ya aprobado. Si la tarea produce archivos, cada archivo debe declarar slot, filename y relativePath.

QUÉ NO ES
No regeneres la pieza completa. No cambies tesis, hook, claims, estructura o copy fuera de alcance. No inventes datos, fuentes, resultados, features, testimonios, fechas ni assets que no existen. No sustituyas una tarea difícil por sugerencias vagas. No marques “done” una tarea que todavía requiere input externo.

DEPENDENCIAS Y TRAZABILIDAD
Estado actual de la tarea: ${task.status}. Assets esperados relacionados: ${(content.expectedAssets||[]).map(a=>`${a.slotId}:${a.relativePath}:${a.status}`).join(' | ')||'sin slots registrados'}. QA actual: claims=${!!content.qa?.claimsChecked}, sources=${!!content.qa?.sourcesChecked}, visual=${!!content.qa?.visualChecked}. Si falta una dependencia, inclúyela en blockers[] y conserva statusSuggested="blocked" o "ready_prompt".

SALIDA EXACTA
Devuelve JSON con taskId="${task.id}", contentId="${content.id}", taskType="${task.type}", result, decisions[], blockers[], warnings[], assets[] con assetSlotId/filename/relativePath cuando aplique, notes, qaChecks[], statusSuggested y nextAction. No devuelvas una entidad de contenido nueva ni cambies content_id.

QA
Comprueba: especificidad de ${client.name}; formato físico correcto; alcance limitado a esta tarea; cero invenciones; rutas/slots correctos; resultado ejecutable; blockers honestos; y compatibilidad con el estado actual. Si el resultado no permite realmente cerrar la tarea, no sugieras done/approved.`;}
function scorePrompt(p){const words=String(p).trim().split(/\s+/).filter(Boolean).length;let score=100;const issues=[];if(words<180){score-=30;issues.push('prompt corto');}for(const x of ['ROL','OBJETIVO','QUÉ ES','QUÉ NO ES','SALIDA','QA'])if(!String(p).includes(x)){score-=8;issues.push(`falta ${x}`);}if(/\bTODO\b|\bTBD\b|\[PENDIENTE(?!: transcripción)/.test(String(p))){score-=15;issues.push('placeholder');}return {score:Math.max(0,score),words,issues,pass:score>=85};}

function genericUnitText(title,label,i,total){const variants=[`El problema no es producir más. Es saber qué decisión tiene que resolver esta pieza: ${title}.`,`Cuando el contexto está separado de la producción, cada entrega obliga a reconstruir criterio desde cero.`,`El sistema funciona cuando la estructura dice qué debe aportar cada bloque, no solo cuánto debe durar.`,`La aplicación concreta es conservar la identidad de la pieza y conectar contenido, prompts, tareas, assets y fecha.`,`La regla final: la velocidad llega después del criterio, no antes.`];return variants[Math.min(i,variants.length-1)];}
function makeUnits(title,type,texts=[]){const labels=formatStructures[type]||formatStructures.article;return labels.map((label,i)=>({id:`u${i+1}`,label,function:i===0?'Abrir la tensión y promesa de la pieza.':i===labels.length-1?'Pagar el hook con una regla o decisión.':'Añadir información nueva que haga avanzar la idea.',text:texts[i]||genericUnitText(title,label,i,labels.length),recording:type==='reel'||type==='horizontal'?(i===0?'Plano medio corto, mirada a lente, pausa de 0,5 s antes de la frase clave.':i===labels.length-1?'Volver a lente, gesto mínimo y pausa final para corte.':'Plano medio; un gesto intencional por idea; permitir overlay lateral sin tapar rostro/manos.'):'No aplica grabación; revisar jerarquía y ritmo de lectura.',visualDirection:type==='carousel'?`Composición editorial del ${label}: una idea dominante, safe area 12%, texto legible, apoyo visual funcional y continuidad con el slide anterior/siguiente.`:type==='reel'||type==='horizontal'?`Speaker-first; apoyo visual en segundo plano o lateral. ${i%2?'Diagrama/UI breve o B-roll funcional':'Presenter limpio con tipografía mínima'}.`:'Visual opcional: diagrama, captura o evidencia solo si mejora comprensión.',broll:type==='reel'||type==='horizontal'?'Apoyo específico de interfaz/proceso conectado con la frase; si no aporta, mantener presenter_only.':'',vfx:{name:i===0?'Spatial Card Materialize':'Context Link Build',simple:'Fade/scale muy sutil 160–220 ms.',medium:'Materialización desde el elemento origen + parallax leve.',advanced:'Tracking/profundidad solo si existe fuente real y mejora comprensión.'},sfx:{sound:i===0?'Soft tactile tick + short air whoosh':'Subtle UI tick',when:'En la entrada o cierre de la microanimación, nunca antes de la voz.',trigger:'Sincronizar con la aparición/encaje del elemento visual.',level:'Bajo voz; cola corta.'},music:{style:'Minimal editorial tech pulse',bpm:'74–88',when:'Base continua con ducking 2–4 dB bajo voz; reducir capas en el cierre.'}}));}
function makeCopies(title,summary){return {instagram:`${title}\n\n${summary}\n\nPublicar no resuelve por sí solo un problema editorial. La diferencia aparece cuando cada pieza tiene una función clara, una estructura que evita repetición y un sistema que sabe qué falta antes de poder salir.\n\nLa pregunta útil no es “¿qué más podemos producir?”, sino “¿qué tiene que entender o decidir mejor la audiencia después de esta pieza?”. A partir de ahí, guion, visual, copy y calendario dejan de competir entre sí.\n\nGuárdalo si estás construyendo un sistema de contenido que tenga que crecer sin perder criterio.`,linkedin:`${title}\n\n${summary}\n\nUna operación editorial madura no empieza contando publicaciones. Empieza identificando qué decisión, objeción o aprendizaje merece convertirse en un activo reusable.\n\nCuando esa definición existe, el formato deja de ser una ocurrencia: el reel, el carrusel, la nota, el visual y el copy cumplen trabajos distintos pero comparten una misma tesis. La coordinación entre esas capas permite aumentar volumen sin volver a reconstruir contexto en cada entrega.\n\nEl criterio práctico es simple: antes de producir, define qué debe cambiar en la cabeza de quien lo consume y qué evidencia o mecanismo sostiene ese cambio. Después eliges el formato.`,tiktok:`${title}\n\n${summary}\n\nNo necesitas rellenar el feed. Necesitas que cada pieza haga un trabajo distinto y que el sistema sepa qué sigue después.`,youtube:`${title}\n\n${summary}\n\nEsta pieza desarrolla el criterio, la aplicación y cómo conectarlo con un sistema editorial completo.`};}
function expectedAssets(clientId,id,type,units){const out=[];if(type==='carousel'){for(let i=1;i<=units;i++)out.push({slotId:`slide-${String(i).padStart(2,'0')}`,kind:'image',group:'slides',filename:`slide-${String(i).padStart(2,'0')}.png`,relativePath:`assets/${clientId}/${id}/slides/slide-${String(i).padStart(2,'0')}.png`,status:'missing'});}else if(['reel','horizontal'].includes(type)){out.push({slotId:'master-video',kind:'video',group:'video',filename:'master.mp4',relativePath:`assets/${clientId}/${id}/video/master.mp4`,status:'missing'},{slotId:'cover-a',kind:'image',group:'covers',filename:'cover-a.png',relativePath:`assets/${clientId}/${id}/covers/cover-a.png`,status:'missing'},{slotId:'cover-b',kind:'image',group:'covers',filename:'cover-b.png',relativePath:`assets/${clientId}/${id}/covers/cover-b.png`,status:'missing'});}else out.push({slotId:'hero',kind:'image',group:'hero',filename:'hero.png',relativePath:`assets/${clientId}/${id}/hero/hero.png`,status:'missing'});return out;}
function productionTasks(id,type){const common=[['copy','Copies','Completar y revisar copies nativos por plataforma.'],['visual','Visuales','Resolver plan visual, prompts y assets esperados.'],['qa','QA','Revisar claims, fuentes, visual y coherencia.'],['publish','Publicación','Confirmar fecha, plataformas y estado final.']];if(['reel','horizontal'].includes(type))common.splice(2,0,['video','Video / B-roll','Resolver master, B-roll/VFX, subtítulos, portada, SFX y música.']);if(type==='carousel')common.splice(2,0,['cover','Portadas / slides','Resolver imágenes finales por slide y portada.']);return common.map((x,i)=>({id:`${id}-task-${i+1}`,type:x[0],label:x[1],description:x[2],status:i===0?'done':'ready_prompt'}));}
