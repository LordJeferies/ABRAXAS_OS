function renderShell(){if(typeof document==='undefined')return;applyClientTheme();const groups=[['OPERAR',['dashboard','clients','library','calendar']],['CREAR / PRODUCIR',['factory','production','shim','airesults']],['SISTEMA',['assets','branding','guide','roadmap']]];document.getElementById('app').innerHTML=`<div class="layer-environment"></div><div class="app-shell"><aside class="rail glass-layer layer-function ${state.ui.sidebarCollapsed?'collapsed':''}"><div class="rail-brand"><div class="version">ABRAXAS A · v${VERSION}</div><h1>ABRAXAS</h1><p>Content Operating System · información → prompts → resultados → producción → revisión → publicación.</p><button class="btn icon rail-collapse" onclick="setSidebarCollapsed()" aria-label="${state.ui.sidebarCollapsed?'Expandir':'Colapsar'} sidebar">${state.ui.sidebarCollapsed?'→':'←'}</button></div><nav class="rail-nav">${groups.map(([label,ids])=>`<div class="nav-label">${label}</div>${ids.map(id=>{const n=NAV.find(x=>x[0]===id);return`<button class="nav-btn materialize ${state.ui.section===id?'active':''}" onclick="go('${id}')"><span class="nav-icon">${n[1]}</span><span class="nav-copy"><strong>${n[2]}</strong><span>${n[3]}</span></span></button>`}).join('')}`).join('')}</nav><div class="rail-foot"><b>P9.3 · v0.9.3</b><br>Mac Spatial Dark + Dynamic Client Accent + He Completion.<br><br>La complejidad vive debajo; la pantalla muestra la siguiente decisión.</div></aside><main class="page layer-content ${state.ui.sidebarCollapsed?'sidebar-collapsed':''}"><header class="topbar glass-layer layer-function"><div class="topbar-location"><h2>${NAV.find(x=>x[0]===state.ui.section)?.[2]||'ABRAXAS'}</h2><span>${esc(topSubtitle())}</span></div><div class="top-actions"><button class="btn hide-compact" onclick="applySavedView('today')">Hoy</button><button class="btn hide-compact" onclick="applySavedView('this_week')">Esta semana</button><button class="btn soft" onclick="go('factory')">✦ Crear</button><button class="btn icon" onclick="go('guide')" aria-label="Guía">?</button><div style="position:relative"><button class="btn icon" onclick="toggleMoreMenu()" aria-label="Más acciones">•••</button>${state.ui.moreMenu?renderMoreMenu():''}</div></div></header><div class="content" id="pageContent"></div></main><div id="focusLayer" class="layer-focus"></div><div class="toast-stack" id="toastStack"></div></div><div class="visual-gate" aria-hidden="true"></div>`;renderPage();afterRender()}
function toggleMoreMenu(){state.ui.moreMenu=!state.ui.moreMenu;renderShell()}
function renderMoreMenu(){return`<div class="popover glass-layer materialize"><button onclick="exportBackup()">Exportar respaldo</button><button onclick="importBackup()">Importar respaldo</button><button onclick="go('guide')">Abrir ayuda</button><button onclick="resetState()">Restaurar demo</button></div>`}
function exportBackup(){download(`ABRAXAS_v${VERSION}_backup.json`,JSON.stringify(state,null,2),'application/json')}
function importBackup(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{if(!i.files[0])return;try{const r=JSON.parse(await i.files[0].text());if(r.data?.version!=='0.9.3')throw new Error('El respaldo no es v0.9.3');snapshotForUndo('Importar respaldo');state=r;saveState();renderShell();toast('Respaldo importado')}catch(e){alert(e.message)}};i.click()}
function renderPage(){const el=document.getElementById('pageContent');const fn={dashboard:renderDashboard,clients:renderClients,library:renderLibrary,calendar:renderCalendar,factory:renderFactory,production:renderProductionQueue,shim:renderShim,airesults:renderAiResults,assets:renderAssets,branding:renderBranding,guide:renderGuide,roadmap:renderRoadmap}[state.ui.section]||renderDashboard;el.innerHTML=fn();applyClientTheme();afterRenderPage()}
function screenContext(title,description,next){return`<div class="screen-context"><div><h1>${esc(title)}</h1><p>${esc(description)}</p></div><div class="where-next"><b>WHERE AM I</b> · ${esc(title)}<br><b>WHAT CAN I DO</b> · trabajar sobre esta vista<br><b>WHERE NEXT</b> · ${esc(next)}</div></div>`}
function renderCommandShelf(){const views=[['today','Hoy','Publicaciones de hoy'],['this_week','Esta semana','Carga semanal'],['pending_ai','Por crear IA','Prompts pendientes'],['ai_result','Resultado IA','Revisar resultados'],['unreviewed','No revisado','QA humano'],['pending_production','Producción','Assets/tareas'],['pending_publish','Listo','Pendiente publicar'],['published','Publicado','Registro final'],['unscheduled','Sin fecha','Backlog editorial']];return`<div class="command-shelf">${views.map(([id,a,b])=>`<button class="command-chip materialize" onclick="applySavedView('${id}')"><b>${a}</b><span>${b}</span></button>`).join('')}</div>`}

function renderDashboard(){const all=state.ui.dashboardClient==='all'?state.data.contents:state.data.contents.filter(c=>c.clientId===state.ui.dashboardClient),counts={};all.forEach(c=>counts[c.lifecycle]=(counts[c.lifecycle]||0)+1);const upcoming=all.filter(c=>c.scheduledAt).sort((a,b)=>a.scheduledAt.localeCompare(b.scheduledAt)).slice(0,5),open=all.filter(c=>(c.productionTasks||[]).some(t=>!['done','approved'].includes(t.status))).length;return`${screenContext('Dashboard','Estado, prioridades y próximas publicaciones sin exponer toda la complejidad interna.','abre una pieza o entra a He/Production Queue')}${renderCommandShelf()}<section class="hero content-surface"><div class="hero-copy"><div class="eyebrow">Dashboard por cliente</div><h1>${state.ui.dashboardClient==='all'?'Control editorial sin ruido.':`${esc(getClient(state.ui.dashboardClient).name)} · control editorial.`}</h1><p>Lee primero el estado, después entra a la pieza. ABRAXAS concentra prompts, producción, assets, revisión y publicación alrededor del mismo contenido.</p><div class="field" style="max-width:280px;margin-top:18px"><label>Cliente activo</label><select onchange="setDashboardClient(this.value)"><option value="all">Todos los clientes</option>${state.data.clients.map(c=>`<option value="${c.id}" ${state.ui.dashboardClient===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div><div class="hero-side"><button class="hero-action materialize" onclick="go('production')"><b>Resolver producción</b><span>→</span><small>${open} piezas con tareas abiertas</small></button><button class="hero-action materialize" onclick="go('factory')"><b>Crear contenido</b><span>→</span><small>Pieza o lote con prompts trazables</small></button><button class="hero-action materialize" onclick="go('calendar')"><b>Ordenar calendario</b><span>→</span><small>Mes completo + backlog drag & drop</small></button></div></section><div class="metrics"><div class="metric"><span>Contenidos</span><b>${all.length}</b><small>registro visible</small></div><div class="metric"><span>AI Ready / Result</span><b>${(counts.AI_READY||0)+(counts.AI_RESULT||0)}</b><small>handoffs activos</small></div><div class="metric"><span>Por producir</span><b>${open}</b><small>con tareas abiertas</small></div><div class="metric"><span>Publicados</span><b>${counts.PUBLISHED||0}</b><small>ciclo cerrado</small></div></div><div class="dashboard-grid"><div class="panel"><div class="panel-head"><div><h3>De prompt a publicación</h3><p>Pipeline horizontal legible; ningún estado compite por ancho.</p></div></div><div class="pipeline-track">${['BUILD','AI_READY','AI_RESULT','REVIEW','PRODUCTION','READY_TO_PUBLISH','SCHEDULED','PUBLISHED'].map(x=>`<button class="pipeline-stage materialize" onclick="applyLifecycleView('${x}')"><span class="count">${counts[x]||0}</span><b style="font-size:9px">${x.replaceAll('_',' ')}</b><small>${lifecycleLabel(x)}</small></button>`).join('')}</div></div><div class="panel"><div class="panel-head"><div><h3>Próximos contenidos</h3><p>Fecha + identidad física + estado.</p></div></div><div class="upcoming-list">${upcoming.map(c=>`<button class="upcoming" onclick="openStudio('${c.id}','dashboard')"><time>${c.scheduledAt}</time><b>${esc(c.title)}</b><small>${esc(getClient(c.clientId).name)} · ${esc(physicalTypeLabel(c.physicalType))} · ${esc(c.recipeClient)}</small></button>`).join('')||'<p style="font-size:10px;color:var(--muted)">Sin próximas publicaciones.</p>'}</div></div></div>`}
function setDashboardClient(v){state.ui.dashboardClient=v;saveState();applyClientTheme();renderShell()}
function applyLifecycleView(v){state.ui.section='library';state.ui.library.view='all';state.ui.library.state=v;saveState();renderShell()}

function renderClients(){if(state.ui.clientDetailId)return renderClientIntelligence();return`${screenContext('Clientes','Cada marca conserva su Brand Core, pilares, patrones, copy profiles, sources y accent sin convertirse en otra aplicación.','selecciona un cliente para abrir Client Intelligence')}<div class="client-grid">${state.data.clients.map(c=>`<article class="client-card card" style="--card-accent-soft:${CORE.hexToRgba?CORE.hexToRgba(c.accent,.12):'rgba(255,255,255,.04)'}"><div class="eyebrow" style="color:${c.accent}">${esc(c.category)}</div><h3>${esc(c.name)}</h3><p class="category">${esc(c.brandCore.core)}</p><div class="client-actions"><button class="client-stat" onclick="event.stopPropagation();openClientDetailSheet('${c.id}','system')">Sistema editorial · aplicado</button><button class="client-stat" onclick="event.stopPropagation();openClientDetailSheet('${c.id}','patterns')">${c.patterns.length} formatos/patrones</button><button class="client-stat" onclick="event.stopPropagation();openClientDetailSheet('${c.id}','copies')">${c.copyProfiles.length} copy profiles</button><button class="client-stat" onclick="event.stopPropagation();openClientDetailSheet('${c.id}','tools')">25 tools</button></div><div style="margin-top:18px"><button class="btn primary" style="background:${c.accent}" onclick="openClientIntelligence('${c.id}')">Ver Client Intelligence →</button></div></article>`).join('')}</div>`}
function openClientIntelligence(id,tab='Overview'){state.ui.clientDetailId=id;state.ui.clientTab=tab;state.ui.section='clients';saveState();applyClientTheme(id);renderShell()}
function closeClientIntelligence(){state.ui.clientDetailId=null;saveState();renderShell()}
function setClientTab(tab){state.ui.clientTab=tab;saveState();renderPage()}
function renderClientIntelligence(){const c=getClient(state.ui.clientDetailId),tabs=['Overview','Brand Core','Pilares','Formatos','Patrones','Copy Profiles','Branding Method','Sources'];return`${screenContext(c.name,`${c.category} · ${c.tone}`,'cambia de pestaña o crea contenido con esta marca')}<div class="client-intel-tabs"><div class="segmented">${tabs.map(t=>`<button class="${state.ui.clientTab===t?'active':''}" onclick="setClientTab('${t}')">${t}</button>`).join('')}</div></div><div class="intel-content">${renderClientTab(c,state.ui.clientTab)}</div><div style="margin-top:12px"><button class="btn" onclick="closeClientIntelligence()">← Volver a clientes</button><button class="btn primary" onclick="startFactoryForClient('${c.id}')">Crear contenido para ${esc(c.name)}</button></div>`}
function renderClientTab(c,tab){if(tab==='Overview')return`<div class="grid cols-2"><div class="card"><div class="eyebrow">Brand Core</div><h4>${esc(c.brandCore.core)}</h4><p>${esc(c.brandCore.identity)}</p></div><div class="card"><div class="eyebrow">Sistema editorial</div><h4>${c.pillars.length} pilares · ${c.patterns.length} patrones · ${c.copyProfiles.length} copy profiles</h4><p>Estas capas alimentan He y Prompt Composer. El formato físico define qué se produce; los patrones aportan ADN estructural.</p></div></div><div class="section-head"><div><h3>Accesos rápidos</h3><p>Progressive disclosure: abre solo lo que necesitas.</p></div></div><div class="grid cols-4"><button class="card" onclick="setClientTab('Pilares')"><h4>Pilares</h4><p>${c.pillars.join(' · ')}</p></button><button class="card" onclick="setClientTab('Patrones')"><h4>Patrones</h4><p>${c.patterns.length} patrones reutilizables y adaptables.</p></button><button class="card" onclick="setClientTab('Copy Profiles')"><h4>Copy Profiles</h4><p>${c.copyProfiles.length} perfiles de voz/plataforma.</p></button><button class="card" onclick="setClientTab('Branding Method')"><h4>25 tools</h4><p>Brand Ego → Brand Gang → Essence → Identity → Experience.</p></button></div>`;if(tab==='Brand Core')return`<div class="brand-core-grid">${[['Brand Core',c.brandCore.core],['Brand Identity',c.brandCore.identity],['Cómo explicárselo al cliente',c.brandCore.clientExplanation],['Cómo vender la marca',c.brandCore.salesNarrative]].map(([a,b])=>`<article class="brand-chapter"><h4>${a}</h4><p>${esc(b)}</p></article>`).join('')}</div><div class="section-head"><div><h3>Proof points y límites</h3></div></div><div class="grid cols-2"><div class="card"><h4>Proof points</h4><div class="tag-row">${c.brandCore.proofPoints.map(x=>`<span class="tag client">${esc(x)}</span>`).join('')}</div></div><div class="card"><h4>Boundaries</h4>${c.brandCore.boundaries.map(x=>`<p style="margin:7px 0">• ${esc(x)}</p>`).join('')}</div></div>`;if(tab==='Pilares')return`<div class="intel-list">${c.pillars.map((p,i)=>`<article class="intel-row"><div><b>${pad(i+1)} · ${esc(p)}</b><p>Territorio editorial activo. Puede combinarse con múltiples formatos físicos y patrones.</p></div><button class="btn xs" onclick="startFactoryForClient('${c.id}','${escAttr(p)}')">Crear aquí</button></article>`).join('')}</div>`;if(tab==='Formatos'||tab==='Patrones')return`<div class="intel-list">${c.patterns.map(p=>`<article class="intel-row"><div><b>${esc(p.name)}</b><p>Nativo: ${p.nativeTypes.map(physicalTypeLabel).join(', ')} · ${esc(p.adaptationRules)}</p></div><button class="btn xs" onclick="openClientDetailSheet('${c.id}','pattern','${p.id}')">Ver estructura</button></article>`).join('')}</div>`;if(tab==='Copy Profiles')return`<div class="grid cols-2">${c.copyProfiles.map(p=>`<article class="copy-profile"><b>${esc(p.name)}</b><p>${esc(p.rules)}</p></article>`).join('')}</div>`;if(tab==='Branding Method')return renderBrandingDrivers(c);if(tab==='Sources')return`<div class="intel-list">${c.sources.map((s,i)=>`<article class="intel-row"><div><b>Fuente ${pad(i+1)}</b><p>${esc(s)}</p></div><span class="tag">Contexto</span></article>`).join('')}</div>`;return''}
function escAttr(v){return String(v).replaceAll("'","&#39;").replaceAll('"','&quot;')}
function openClientDetailSheet(clientId,type,patternId=''){const c=getClient(clientId);let title='',body='';if(type==='system'){title='Sistema editorial aplicado';body=`<p>El sistema editorial de <b>${esc(c.name)}</b> conecta sus pilares, patrones, copy profiles, Brand Core, fuentes y reglas visuales. He utiliza estas capas para compilar prompts específicos sin convertir cada formato en una plantilla cerrada.</p>`}else if(type==='patterns'){title=`${c.patterns.length} patrones / formatos`;body=c.patterns.map(p=>`<div class="intel-row"><div><b>${esc(p.name)}</b><p>${esc(p.structure.join(' → '))}</p></div><span class="tag">${p.nativeTypes.map(physicalTypeLabel).join(', ')}</span></div>`).join('')}else if(type==='copies'){title='Copy Profiles';body=c.copyProfiles.map(p=>`<div class="copy-profile"><b>${esc(p.name)}</b><p>${esc(p.rules)}</p></div>`).join('')}else if(type==='tools'){title='Branding Method · 25 tools';body=state.data.brandingDrivers.map(d=>`<p><b>${esc(d.name)}</b> · ${d.tools.length} tools</p>`).join('')}else if(type==='pattern'){const p=c.patterns.find(x=>x.id===patternId);title=p?.name||'Patrón';body=`<p><b>Qué hace:</b> ${esc(p?.toneRules||'')}</p><p><b>Estructura:</b> ${esc((p?.structure||[]).join(' → '))}</p><p><b>Adaptación:</b> ${esc(p?.adaptationRules||'')}</p><p><b>Visual:</b> ${esc(p?.visualRules||'')}</p><p><b>Copy:</b> ${esc(p?.copyRules||'')}</p>`}openSheet(title,body)}
function startFactoryForClient(id,pillar=''){state.factory.clientId=id;state.factory.pillar=pillar||getClient(id).pillars[0];state.factory.clientPatternId=getClient(id).patterns[0].id;state.ui.section='factory';state.factory.mode='piece';state.factory.step=1;saveState();renderShell()}

function contentMatchesView(c){const f=state.ui.library,q=f.query.trim().toLowerCase();if(q&&!`${c.title} ${c.summary} ${c.pillar} ${c.recipeClient}`.toLowerCase().includes(q))return false;if(f.client!=='all'&&c.clientId!==f.client)return false;if(f.physical!=='all'&&c.physicalType!==f.physical)return false;if(f.pillar!=='all'&&c.pillar!==f.pillar)return false;if(f.state!=='all'&&c.lifecycle!==f.state)return false;if(f.lot!=='all'&&c.lot!==f.lot)return false;const t=todayIso(),weekStart='2026-08-03',weekEnd='2026-08-09';switch(f.view){case'today':return c.scheduledAt===t;case'this_week':return c.scheduledAt>=weekStart&&c.scheduledAt<=weekEnd;case'pending_ai':return c.lifecycle==='AI_READY';case'ai_result':return c.lifecycle==='AI_RESULT';case'unreviewed':return c.reviewState!=='reviewed';case'pending_production':return c.lifecycle==='PRODUCTION'||productionProgress(c)<100;case'pending_publish':return ['READY_TO_PUBLISH','SCHEDULED','READY'].includes(c.lifecycle)&&c.publicationStatus!=='published';case'published':return c.lifecycle==='PUBLISHED'||c.publicationStatus==='published';case'unscheduled':return !c.scheduledAt;default:return true}}
function renderLibrary(){const items=state.data.contents.filter(contentMatchesView),pillars=[...new Set(state.data.clients.flatMap(c=>c.pillars))];return`${screenContext('Biblioteca','Una vista de todo el sistema editorial con filtros por tiempo, progreso y patrón.','abre una pieza para entrar al Content Studio 1×1')}<div class="saved-view-shelf">${[{id:'all',name:'Todo'},...state.data.savedViews].map(v=>`<button class="saved-view ${state.ui.library.view===v.id?'active':''}" onclick="setLibraryView('${v.id}')">${esc(v.name)}</button>`).join('')}</div><div class="library-toolbar"><input placeholder="Buscar contenido, tema, pilar o patrón…" value="${esc(state.ui.library.query)}" oninput="setLibraryFilter('query',this.value)"><select onchange="setLibraryFilter('client',this.value)"><option value="all">Todos los clientes</option>${state.data.clients.map(c=>`<option value="${c.id}" ${state.ui.library.client===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select onchange="setLibraryFilter('physical',this.value)"><option value="all">Todos los tipos</option>${Object.keys(CORE.PHYSICAL).map(k=>`<option value="${k}" ${state.ui.library.physical===k?'selected':''}>${esc(physicalTypeLabel(k))}</option>`).join('')}</select><select onchange="setLibraryFilter('state',this.value)"><option value="all">Todos los estados</option>${LIFECYCLE.map(x=>`<option value="${x}" ${state.ui.library.state===x?'selected':''}>${x}</option>`).join('')}</select><select onchange="setLibraryFilter('lot',this.value)"><option value="all">Todos los lotes</option>${LOTS.map(x=>`<option value="${x}" ${state.ui.library.lot===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="library-grid">${items.map(renderContentCard).join('')||'<div class="card"><h4>No hay contenidos en esta vista.</h4><p>Cambia filtros o crea una pieza desde He.</p></div>'}</div>`}
function setLibraryView(v){state.ui.library.view=v;saveState();renderPage()}
function setLibraryFilter(k,v){state.ui.library[k]=v;if(k!=='query')saveState();renderPage()}
function renderContentCard(c){const client=getClient(c.clientId),p=productionProgress(c);return`<article class="content-card materialize" style="border-top-color:${client.accent}"><div class="content-thumb"><span class="type-mark">${PHYSICAL_ICONS[c.physicalType]||'·'} · ${esc(physicalTypeLabel(c.physicalType))}</span></div><div class="content-body"><div class="tag-row"><span class="tag client" style="--client-accent:${client.accent};--client-accent-soft:${client.accent}20;--client-accent-border:${client.accent}55">${esc(client.name)}</span><span class="tag">${esc(c.lot)}</span><span class="tag"><i class="state-dot ${stateClass(c.lifecycle)}"></i>${esc(lifecycleLabel(c.lifecycle))}</span></div><h4>${esc(c.title)}</h4><p>${esc(c.summary)}</p><div class="progress" style="margin-top:10px"><i style="width:${p}%;background:${client.accent}"></i></div><div class="content-foot"><span style="font-size:8px;color:var(--muted)">${p}% producción · ${c.scheduledAt||'sin fecha'}</span><button class="btn xs" onclick="openStudio('${c.id}','library')">Ver contenido →</button></div></div></article>`}

function openStudio(id,ret='library'){state.ui.studioId=id;state.ui.studioReturn=ret;state.ui.studioTab='overview';saveState();renderStudioOverlay()}
function closeStudio(){const ret=state.ui.studioReturn;state.ui.studioId=null;saveState();if(ret==='dashboard')state.ui.section='dashboard';if(ret==='calendar')state.ui.section='calendar';if(ret==='production')state.ui.section='production';renderShell()}
function setStudioTab(t){state.ui.studioTab=t;saveState();renderStudioOverlay()}
function renderStudioOverlay(){if(typeof document==='undefined')return;const c=getContent(state.ui.studioId);if(!c){state.ui.studioId=null;return}applyClientTheme(c.clientId);const client=getClient(c.clientId),p=productionProgress(c);document.getElementById('focusLayer').innerHTML=`<section class="studio-shell"><header class="studio-top glass-layer"><div style="display:flex;gap:8px;align-items:center"><button class="btn icon" onclick="closeStudio()">←</button><b style="font-size:11px">Content Studio 1×1</b><span class="tag client">${esc(client.name)}</span></div><div style="display:flex;gap:6px"><button class="btn" onclick="exportContentPart('${c.id}','all')">Exportar ▾</button><button class="btn primary" onclick="markReviewed('${c.id}')">${c.reviewState==='reviewed'?'Revisado ✓':'Marcar revisado'}</button></div></header><div class="studio-wrap"><div class="studio-hero"><div><div class="eyebrow">PHYSICAL TYPE · ${esc(physicalTypeLabel(c.physicalType))}</div><h1>${esc(c.title)}</h1><div class="studio-meta"><span class="tag client">${esc(client.name)}</span><span class="tag">${esc(c.recipeClient)}</span><span class="tag">${esc(c.pillar)}</span><span class="tag">${esc(c.lot)}</span><span class="tag"><i class="state-dot ${stateClass(c.lifecycle)}"></i>${esc(lifecycleLabel(c.lifecycle))}</span><span class="tag">${c.scheduledAt||'Sin fecha'}</span></div></div><div style="text-align:right"><div style="font-size:28px;font-weight:700">${p}%</div><div style="font-size:8px;color:var(--muted)">PRODUCCIÓN</div></div></div><div class="studio-tabs"><div class="segmented">${STUDIO_TABS.map(([id,l])=>`<button class="${state.ui.studioTab===id?'active':''}" onclick="setStudioTab('${id}')">${l}</button>`).join('')}</div></div><div id="studioPanel">${renderStudioPanel(c,state.ui.studioTab)}</div></div></section>`}
function renderStudioPanel(c,t){if(t==='overview')return renderStudioOverview(c);if(t==='content')return renderStudioContent(c);if(t==='copies')return renderStudioCopies(c);if(t==='prompts')return renderStudioPrompts(c);if(t==='production')return renderStudioProduction(c);if(t==='qa')return renderStudioQa(c);return renderStudioHistory(c)}
function renderStudioOverview(c){const client=getClient(c.clientId),p=productionProgress(c),a=assetProgress(c);return`<div class="studio-overview-grid"><div class="card"><div class="eyebrow">Información general</div><h4 style="font-size:18px;margin-top:8px">${esc(c.summary)}</h4><p style="margin-top:10px">${esc(c.thesis)}</p><div class="studio-kpi-grid" style="margin-top:14px"><div class="studio-kpi"><span>PHYSICAL TYPE</span><b>${esc(physicalTypeLabel(c.physicalType))}</b></div><div class="studio-kpi"><span>PATRÓN</span><b>${esc(c.recipeClient)}</b></div><div class="studio-kpi"><span>PILAR</span><b>${esc(c.pillar)}</b></div><div class="studio-kpi"><span>LOTE</span><b>${esc(c.lot)}</b></div></div></div><div class="card"><div class="eyebrow">Estado operativo</div><h4 style="margin-top:8px">${esc(lifecycleLabel(c.lifecycle))}</h4><div style="margin-top:12px"><span style="font-size:8px;color:var(--muted)">Producción ${p}%</span><div class="progress"><i style="width:${p}%"></i></div></div><div style="margin-top:12px"><span style="font-size:8px;color:var(--muted)">Assets ${a}%</span><div class="progress"><i style="width:${a}%"></i></div></div><p style="margin-top:14px"><b>Qué puedes hacer aquí:</b> editar contenido, dirección visual, copies, prompts y QA.<br><b>Siguiente:</b> resolver tareas abiertas → calendarizar → publicar.</p></div></div>`}
function renderStudioContent(c){return`<div class="unit-list">${(c.units||[]).map((u,i)=>`<article class="unit-card"><div class="unit-head"><div><div class="eyebrow">${esc(u.label||`Unidad ${i+1}`)}</div><h4>${esc(u.function)}</h4></div><span class="tag">${i+1}/${c.units.length}</span></div><div class="unit-layout"><div class="unit-preview"><div><b>${esc(u.visualDirection)}</b><br><br>Asset esperado: ${(c.expectedAssets||[])[Math.min(i,(c.expectedAssets||[]).length-1)]?.relativePath||'sin slot'}</div></div><div class="unit-controls"><div class="field"><label>Guion / texto</label><textarea oninput="updateUnit('${c.id}',${i},'text',this.value)">${esc(u.text)}</textarea></div><div class="field"><label>Función narrativa</label><textarea oninput="updateUnit('${c.id}',${i},'function',this.value)">${esc(u.function)}</textarea></div><div class="guidance-grid"><div class="guidance"><b>Encuadre / grabación</b><p>${esc(u.recording)}</p></div><div class="guidance"><b>B-roll / apoyo</b><p>${esc(u.broll)}</p></div><div class="guidance"><b>VFX · ${esc(u.vfx?.name||'No effect')}</b><p>Simple: ${esc(u.vfx?.simple||'—')}<br>Medio: ${esc(u.vfx?.medium||'—')}<br>Avanzado: ${esc(u.vfx?.advanced||'—')}</p></div><div class="guidance"><b>SFX</b><p>SOUND: ${esc(u.sfx?.sound||'no_sfx_needed')}<br>WHEN: ${esc(u.sfx?.when||'—')}<br>TRIGGER: ${esc(u.sfx?.trigger||'—')}<br>LEVEL: ${esc(u.sfx?.level||'—')}</p></div></div><details class="disclosure"><summary>Editar dirección visual</summary><div class="disclosure-body"><textarea oninput="updateUnit('${c.id}',${i},'visualDirection',this.value)">${esc(u.visualDirection)}</textarea></div></details>${renderUnitDeepPrompts(c,u,i)}</div></div></article>`).join('')}</div>`}
function deepPromptDisclosure(title,prompt,copyExpr){return`<details class="disclosure deep-unit-prompt"><summary>${esc(title)}</summary><div class="disclosure-body"><div class="prompt-box">${esc(prompt)}</div><button class="btn xs" onclick="copyText(${copyExpr})">Copiar prompt</button></div></details>`}
function renderUnitDeepPrompts(c,u,i){const client=getClient(c.clientId),args=`getContent('${c.id}'),getContent('${c.id}').units[${i}],${i},getClient('${c.clientId}')`;let html=deepPromptDisclosure('Prompt de producción de esta unidad',unitProductionPrompt(c,u,i),`unitProductionPrompt(getContent('${c.id}'),getContent('${c.id}').units[${i}],${i})`);if(c.physicalType==='carousel'){html+=deepPromptDisclosure('Imagen del slide · CON texto',CORE.compileCarouselSlidePrompt(c,u,i,client,true),`CORE.compileCarouselSlidePrompt(${args},true)`);html+=deepPromptDisclosure('Imagen del slide · SIN texto',CORE.compileCarouselSlidePrompt(c,u,i,client,false),`CORE.compileCarouselSlidePrompt(${args},false)`);html+=deepPromptDisclosure('Imagen fija / apoyo visual',CORE.compileUnitStillPrompt(c,u,i,client),`CORE.compileUnitStillPrompt(${args})`);return html}if(['reel','horizontal'].includes(c.physicalType)){html+=deepPromptDisclosure('Omni / VFX · source video',CORE.compileUnitOmniPrompt(c,u,i,client),`CORE.compileUnitOmniPrompt(${args})`);html+=deepPromptDisclosure('Referencias visuales · START / MIDDLE / END',CORE.compileUnitReferenceImagesPrompt(c,u,i,client),`CORE.compileUnitReferenceImagesPrompt(${args})`);html+=deepPromptDisclosure('B-roll · video independiente',CORE.compileUnitBrollPrompt(c,u,i,client),`CORE.compileUnitBrollPrompt(${args})`);html+=deepPromptDisclosure('Foto / still de apoyo',CORE.compileUnitStillPrompt(c,u,i,client),`CORE.compileUnitStillPrompt(${args})`);html+=deepPromptDisclosure('SFX · generación / búsqueda',CORE.compileUnitSfxPrompt(c,u,i,client),`CORE.compileUnitSfxPrompt(${args})`);return html}html+=deepPromptDisclosure('Imagen / apoyo visual',CORE.compileUnitStillPrompt(c,u,i,client),`CORE.compileUnitStillPrompt(${args})`);return html}
function unitProductionPrompt(c,u,i){const client=getClient(c.clientId);return`ABRAXAS · UNIT PRODUCTION · ${c.id} · ${u.id}\n\nROL\nActúa como director de producción para ${client.name}.\n\nOBJETIVO\nResolver únicamente la unidad ${i+1}: ${u.label}. Función: ${u.function}. Texto: ${u.text}.\n\nQUÉ ES\nUn plan ejecutable de grabación/visual/B-roll/VFX/SFX para esta unidad.\n\nQUÉ NO ES\nNo reescribas el guion completo ni inventes evidencia.\n\nDIRECCIÓN\nGrabación: ${u.recording}. Visual: ${u.visualDirection}. B-roll: ${u.broll}. VFX: ${u.vfx?.name||'none'}. SFX: ${u.sfx?.sound||'no_sfx_needed'} / WHEN ${u.sfx?.when||'—'} / TRIGGER ${u.sfx?.trigger||'—'}.\n\nSALIDA\nJSON con unitId, recording, visual, broll, vfx, sfx, music, assetSlot y qa.\n\nQA\nTodo debe tener función narrativa, preservar identidad/evidencia y poder producirse sin este chat.`}
function updateUnit(id,i,k,v){const c=getContent(id);snapshotForUndo(`Editar ${c.title}`);c.units[i][k]=v;c.structure=c.units.map(x=>({name:x.label,function:x.function}));recompileContentPrompts(c);saveState()}
function renderStudioCopies(c){const platforms=Object.keys(c.copies||{});return`<div class="grid cols-2">${platforms.map(p=>`<article class="copy-card"><div class="panel-head"><div><h3>${esc(p)}</h3><p>Editable; amplía el contenido, no lo duplica.</p></div><button class="btn xs" onclick="copyText(getContent('${c.id}').copies['${p}'])">Copiar</button></div><textarea style="min-height:230px" oninput="updateCopy('${c.id}','${p}',this.value)">${esc(c.copies[p])}</textarea></article>`).join('')}</div>`}
function updateCopy(id,p,v){getContent(id).copies[p]=v;saveState()}
function ensurePromptInputs(c){c.promptInputs=c.promptInputs||{};const d={audience:c.audience||'',problem:c.problem||c.summary||'',desiredChange:c.desiredChange||c.thesis||'',evidence:c.evidence||'Fuentes aprobadas del cliente / Source Truth.',claims:c.claims||'No inventar claims, cifras, fuentes ni features.',cta:c.cta||'Cierre de criterio; CTA suave si aplica.',primaryPlatform:c.primaryPlatform||c.platforms?.[0]||'LinkedIn',recipeClient:c.recipeClient||'',recipeUniversal:c.recipeUniversal||'',structure:c.structure||[]};for(const[k,v]of Object.entries(d))if(c.promptInputs[k]===undefined)c.promptInputs[k]=deepClone(v);return c.promptInputs}
function recompileContentPrompts(c){const p=ensurePromptInputs(c),client=getClient(c.clientId);c.prompts={editorial:CORE.compileEditorialPrompt(c,client,p),visual:CORE.compileVisualPrompt(c,client,p)}}
function renderStudioPrompts(c){const p=ensurePromptInputs(c);recompileContentPrompts(c);return`<div class="card"><div class="panel-head"><div><h3>Prompt Composer</h3><p>Edita decisiones estructurales; el prompt compilado se actualiza automáticamente.</p></div></div><div class="prompt-composer">${promptField(c,'audience','Audiencia / decisor')}${promptField(c,'problem','Problema / tensión')}${promptField(c,'desiredChange','Cambio deseado')}${promptField(c,'evidence','Evidencia / fuentes')}${promptField(c,'claims','Claims / restricciones')}${promptField(c,'cta','CTA / cierre')}${promptField(c,'primaryPlatform','Plataforma principal')}${promptField(c,'recipeClient','Patrón cliente')}${promptField(c,'recipeUniversal','Patrón universal')}${promptStructureField(c)}</div></div><details class="disclosure" style="margin-top:10px"><summary>Prompt completo · contenido</summary><div class="disclosure-body"><div class="prompt-box">${esc(c.prompts.editorial)}</div><button class="btn xs" onclick="copyText(getContent('${c.id}').prompts.editorial)">Copiar editorial</button></div></details><details class="disclosure" style="margin-top:8px"><summary>Prompt completo · visual</summary><div class="disclosure-body"><div class="prompt-box">${esc(c.prompts.visual)}</div><button class="btn xs" onclick="copyText(getContent('${c.id}').prompts.visual)">Copiar visual</button></div></details>`}
function promptField(c,key,label){return`<div class="field"><label>${label}</label><textarea data-prompt-field="${key}" oninput="updatePromptInput('${c.id}','${key}',this.value)">${esc(ensurePromptInputs(c)[key]||'')}</textarea></div>`}
function promptStructureField(c){return`<div class="field full"><label>Estructura editable</label><textarea data-prompt-field="structure" oninput="updatePromptStructure('${c.id}',this.value)">${esc((ensurePromptInputs(c).structure||[]).map(x=>`${x.name||x.label}: ${x.function||''}`).join('\n'))}</textarea></div>`}
function updatePromptInput(id,k,v){const c=getContent(id);ensurePromptInputs(c)[k]=v;recompileContentPrompts(c);saveState()}
function updatePromptStructure(id,v){const c=getContent(id);c.promptInputs.structure=v.split('\n').filter(Boolean).map((line,i)=>{const[a,...b]=line.split(':');return{name:a.trim()||`Unidad ${i+1}`,function:b.join(':').trim()}});recompileContentPrompts(c);saveState()}
function renderStudioProduction(c){return`<div class="task-list">${(c.productionTasks||[]).map(t=>`<article class="task-card"><div><b>${esc(t.label)}</b><p>${esc(t.description)}</p><span class="tag" style="margin-top:7px">${esc(t.status)}</span></div><div style="display:grid;gap:5px"><button class="btn xs" onclick="copyText(CORE.makeTaskPrompt(getContent('${c.id}'),getContent('${c.id}').productionTasks.find(x=>x.id==='${t.id}'),getClient('${c.clientId}')))">Copiar prompt</button><button class="btn xs ${t.status==='done'?'soft':''}" onclick="toggleTask('${c.id}','${t.id}')">${t.status==='done'?'Reabrir':'Marcar done'}</button></div></article>`).join('')}</div>`}
function toggleTask(cid,tid){const t=getContent(cid).productionTasks.find(x=>x.id===tid);snapshotForUndo(`Cambiar tarea ${t.label}`);t.status=t.status==='done'?'ready_prompt':'done';saveState();renderStudioOverlay()}
function renderStudioQa(c){return`<div class="grid cols-2"><div class="card"><div class="eyebrow">Checks</div>${[['claimsChecked','Claims'],['sourcesChecked','Fuentes'],['visualChecked','Visual']].map(([k,l])=>`<label style="display:flex;gap:8px;align-items:center;margin:10px 0;font-size:10px"><input type="checkbox" style="width:auto" ${c.qa[k]?'checked':''} onchange="setQa('${c.id}','${k}',this.checked)">${l}</label>`).join('')}</div><div class="card"><div class="eyebrow">Lifecycle</div><select onchange="setLifecycle('${c.id}',this.value)">${LIFECYCLE.map(x=>`<option value="${x}" ${c.lifecycle===x?'selected':''}>${x} · ${lifecycleLabel(x)}</option>`).join('')}</select><p style="margin-top:12px">ABRAXAS puede sugerir estado, pero el cambio crítico permanece visible y reversible.</p><button class="btn soft" style="margin-top:10px" onclick="suggestLifecycle('${c.id}')">Aplicar sugerencia</button></div></div>`}
function setQa(id,k,v){getContent(id).qa[k]=v;saveState()}
function setLifecycle(id,v){snapshotForUndo(`Estado ${getContent(id).title}`);getContent(id).lifecycle=v;saveState();renderStudioOverlay()}
function suggestLifecycle(id){const c=getContent(id),open=(c.productionTasks||[]).filter(t=>t.status!=='done'),allQa=c.qa.claimsChecked&&c.qa.sourcesChecked&&c.qa.visualChecked;let v=c.lifecycle;if(c.publicationStatus==='published')v='PUBLISHED';else if(allQa&&!open.length&&c.scheduledAt)v='SCHEDULED';else if(allQa&&!open.length)v='READY_TO_PUBLISH';else if(open.length)v='PRODUCTION';else v='REVIEW';setLifecycle(id,v)}
function renderStudioHistory(c){return`<div class="intel-list">${(c.history||[]).slice().reverse().map(h=>`<article class="intel-row"><div><b>v${h.version} · ${esc(h.reason)}</b><p>${esc(h.summary)} · ${esc(h.at)}</p></div></article>`).join('')}</div>`}
function markReviewed(id){const c=getContent(id);c.reviewState='reviewed';c.history.push({version:(c.history.at(-1)?.version||0)+1,at:new Date().toISOString(),reason:'Revisión humana',summary:'Contenido marcado como revisado.'});saveState();renderStudioOverlay()}
function exportContentPart(id,type){const c=getContent(id);if(type==='all')download(`${id}_content_package.json`,JSON.stringify(c,null,2),'application/json')}

function monthCells(cursor){const[y,m]=cursor.split('-').map(Number),first=new Date(y,m-1,1),start=new Date(y,m-1,1-first.getDay()),cells=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);cells.push({date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,day:d.getDate(),other:d.getMonth()!==m-1})}return cells}
function shiftMonth(delta){const[y,m]=state.ui.calendarCursor.split('-').map(Number),d=new Date(y,m-1+delta,1);state.ui.calendarCursor=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;saveState();renderPage()}
function renderCalendar(){const cells=monthCells(state.ui.calendarCursor),backlog=state.data.contents.filter(c=>!c.scheduledAt),client=getClient(activeClientId());return`${screenContext('Calendario editorial','Mes completo, backlog, drag & drop y una leyenda que separa cliente, tipo, estado y lote.','abre una pieza o muévela a otra fecha')}<div class="calendar-header"><div><button class="btn icon" onclick="shiftMonth(-1)">←</button> <button class="btn" onclick="state.ui.calendarCursor='2026-08';saveState();renderPage()">Agosto 2026</button> <button class="btn icon" onclick="shiftMonth(1)">→</button></div><div style="display:flex;gap:7px"><div class="calendar-legend-inline"><span><i class="state-dot state-ready"></i> estado</span><span style="color:var(--client-accent)">▬ cliente</span><span>▦ tipo</span><span>L1 lote</span></div><button class="btn soft" onclick="openCalendarLegend()">Leyenda</button></div></div><div class="calendar-layout"><aside class="backlog"><h3>Sin calendarizar</h3><p style="font-size:8px;color:var(--muted)">Arrastra al mes o usa “Fecha”.</p><div id="calendarBacklog" class="backlog-drop">${backlog.map(c=>renderCalItem(c,true)).join('')||'<p style="font-size:9px;color:var(--muted)">Backlog vacío.</p>'}</div></aside><section class="calendar-main"><div class="calendar-grid">${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells.map(cell=>`<div class="day ${cell.other?'other':''} ${cell.date===todayIso()?'today':''}" data-date="${cell.date}"><div class="day-num">${cell.day}</div>${state.data.contents.filter(c=>c.scheduledAt===cell.date).map(c=>renderCalItem(c,false)).join('')}</div>`).join('')}</div></section></div>`}
function renderCalItem(c,backlog){const client=getClient(c.clientId);return`<article class="cal-item" draggable="true" data-content-id="${c.id}" style="border-left:3px solid ${client.accent}"><div class="top"><span style="font-size:7px;color:${client.accent}">${esc(client.name)}</span><i class="state-dot ${stateClass(c.lifecycle)}"></i></div><b>${esc(c.title)}</b><small>${PHYSICAL_ICONS[c.physicalType]||'·'} ${esc(physicalTypeLabel(c.physicalType))} · ${esc(c.recipeClient)}</small><small>${esc(c.lot)} · ${esc(lifecycleLabel(c.lifecycle))}</small><div style="display:flex;justify-content:flex-end;gap:4px"><button class="btn xs" onclick="event.stopPropagation();openStudio('${c.id}','calendar')">Ver</button>${backlog?`<button class="btn xs" onclick="event.stopPropagation();promptSchedule('${c.id}')">Fecha</button>`:''}</div></article>`}
function bindCalendarDnD(){let dragged=null;document.querySelectorAll('[draggable="true"][data-content-id]').forEach(n=>n.addEventListener('dragstart',()=>dragged=n.dataset.contentId));document.querySelectorAll('.day').forEach(day=>{day.addEventListener('dragover',e=>{e.preventDefault();day.classList.add('over')});day.addEventListener('dragleave',()=>day.classList.remove('over'));day.addEventListener('drop',e=>{e.preventDefault();day.classList.remove('over');if(dragged)setCalendarDate(dragged,day.dataset.date)})});const b=document.getElementById('calendarBacklog');if(b){b.addEventListener('dragover',e=>{e.preventDefault();b.classList.add('over')});b.addEventListener('dragleave',()=>b.classList.remove('over'));b.addEventListener('drop',e=>{e.preventDefault();b.classList.remove('over');if(dragged)setCalendarDate(dragged,null)})}}
function setCalendarDate(id,date){snapshotForUndo(`Mover ${getContent(id).title}`);getContent(id).scheduledAt=date;saveState();renderPage();toast(date?`Movido a ${date}`:'Movido a Sin calendarizar')}
function promptSchedule(id){const v=prompt('Fecha YYYY-MM-DD',getContent(id).scheduledAt||'2026-09-01');if(v&&/^\d{4}-\d{2}-\d{2}$/.test(v))setCalendarDate(id,v)}
function openCalendarLegend(){openSheet('Leyenda del calendario',`<div class="legend-sheet-grid"><div class="legend-dimension"><h4>Cliente</h4><p>La línea/accent identifica la marca activa. El color de cliente no significa aprobación ni publicación.</p></div><div class="legend-dimension"><h4>Tipo físico</h4><p>Icono + texto: Reel, Carrusel, Video horizontal, LinkedIn, Newsletter, Nota, Stories o Imagen.</p></div><div class="legend-dimension"><h4>Estado productivo</h4><p>Dot semántico + texto: BUILD, AI READY, REVIEW, PRODUCTION, READY, SCHEDULED o PUBLISHED.</p></div><div class="legend-dimension"><h4>Lote</h4><p>L1 = principal/profundo; L2 = derivado/intermedio; L3 = soporte, stories o contenido simple. Siempre aparece escrito.</p></div></div><p style="font-size:9px;color:var(--muted);margin-top:12px">Una pieza puede mostrar simultáneamente accent de cliente, icono de formato y estado semántico sin depender solo del color.</p>`)}

function factoryClient(){return getClient(state.factory.clientId)}
function factoryClientPattern(){return factoryClient().patterns.find(p=>p.id===state.factory.clientPatternId)||factoryClient().patterns[0]}
function factoryUniversalPattern(){return state.data.universalPatterns.find(p=>p.id===state.factory.universalPatternId)||null}
function ensureFactoryDefaults(){const c=factoryClient();if(!c.pillars.includes(state.factory.pillar))state.factory.pillar=c.pillars[0];if(!c.patterns.some(p=>p.id===state.factory.clientPatternId))state.factory.clientPatternId=c.patterns[0].id;if(!state.factory.structure.length)state.factory.structure=CORE.mergeStructures(state.factory.physicalType,factoryClientPattern(),factoryUniversalPattern());if(!state.factory.coverage.length)generateCoverage()}
function renderFactory(){ensureFactoryDefaults();return`${screenContext('He - Content Factory','Construye una pieza o un lote completo a partir de contexto de cliente, patrones y prompts prehechos.','guarda AI READY y continúa en Resultados IA/Production Queue')}<div class="he-shell"><div class="he-mode segmented"><button class="${state.factory.mode==='piece'?'active':''}" onclick="setFactoryMode('piece')">Crear pieza</button><button class="${state.factory.mode==='batch'?'active':''}" onclick="setFactoryMode('batch')">Crear lote</button></div>${state.factory.mode==='piece'?renderFactoryPiece():renderFactoryBatch()}</div>`}
function setFactoryMode(m){state.factory.mode=m;state.factory.step=1;saveState();renderPage()}
function setFactoryClient(id){state.factory.clientId=id;const c=getClient(id);state.factory.pillar=c.pillars[0];state.factory.clientPatternId=c.patterns[0].id;state.factory.coverage=[];state.factory.structure=[];state.factory.batch.pillars=[c.pillars[0]];state.factory.batch.preferredPatterns=[c.patterns[0].id];saveState();applyClientTheme(id);renderShell()}
function renderFactoryPiece(){const f=state.factory,c=factoryClient();return`<div class="wizard-steps">${['Tipo + ADN','Contexto','Coverage + estructura','Prompts'].map((x,i)=>`<div class="wizard-step ${f.step===i+1?'active':''}">${i+1} · ${x}</div>`).join('')}</div><section class="wizard-card">${f.step===1?renderPieceStep1(c):f.step===2?renderPieceStep2(c):f.step===3?renderPieceStep3(c):renderPieceStep4(c)}<div style="display:flex;justify-content:space-between;margin-top:18px"><div>${f.step>1?`<button class="btn" onclick="factoryStep(-1)">← Anterior</button>`:''}</div><div>${f.step<4?`<button class="btn primary" onclick="factoryStep(1)">Siguiente →</button>`:''}</div></div></section>`}
function factoryStep(delta){state.factory.step=clamp(state.factory.step+delta,1,4);if(state.factory.step===3){generateCoverage();state.factory.structure=CORE.mergeStructures(state.factory.physicalType,factoryClientPattern(),factoryUniversalPattern())}if(state.factory.step===4)compileFactoryPiecePackage();saveState();renderPage()}
function renderPieceStep1(c){const f=state.factory;return`<div class="eyebrow">PASO 1</div><h2>¿Qué quieres producir?</h2><p style="font-size:10px;color:var(--muted)">El formato físico manda. Los patrones aportan estructura/contexto y pueden ser NATIVOS o ADAPTADOS.</p><div class="field" style="margin-top:12px"><label>Cliente</label><select onchange="setFactoryClient(this.value)">${state.data.clients.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="section-head"><div><h3>Tipo de contenido</h3><p>Define qué objeto final se producirá.</p></div></div><div class="physical-grid">${Object.keys(CORE.PHYSICAL).map(k=>`<button class="choice-card ${f.physicalType===k?'active':''}" onclick="setPhysicalType('${k}')"><b>${PHYSICAL_ICONS[k]||'·'} ${esc(physicalTypeLabel(k))}</b><small>Salida física soberana</small></button>`).join('')}</div><div class="section-head"><div><h3>Pilares del cliente</h3><p>Territorio temático/estratégico.</p></div></div><div class="pillar-grid">${c.pillars.map(p=>`<button class="pill-choice ${f.pillar===p?'active':''}" onclick="setFactoryPillar('${escAttr(p)}')">${esc(p)}</button>`).join('')}</div><div class="section-head"><div><h3>Patrones del cliente</h3><p>Se pueden usar aunque su forma nativa sea distinta: ABRAXAS los adapta.</p></div></div><div class="pattern-grid">${c.patterns.map(p=>patternCard(p,'client')).join('')}</div><div class="section-head"><div><h3>Patrones universales</h3><p>Capa opcional para combinar el ADN del cliente con un patrón reusable.</p></div></div><div class="pattern-grid">${state.data.universalPatterns.map(p=>patternCard(p,'universal')).join('')}</div>${combinationPreview()}<div class="section-head"><div><h3>¿Cuántos?</h3><p>Misma familia temática ≠ misma idea repetida.</p></div></div><div class="quantity">${[1,2,3,4,5,6].map(n=>`<button class="${f.quantity===n?'active':''}" onclick="setFactoryQuantity(${n})">${n}</button>`).join('')}</div>`}
function patternCard(p,scope){const translation=CORE.translatePatternToPhysical(p,state.factory.physicalType),active=scope==='client'?state.factory.clientPatternId===p.id:state.factory.universalPatternId===p.id;return`<button class="pattern-card ${active?'active':''}" onclick="selectFactoryPattern('${scope}','${p.id}')"><div class="native-badge ${translation.mode==='NATIVO'?'native':'adapted'}">${translation.mode}</div><b>${esc(p.name)}</b><p>${esc((p.structure||[]).join(' → '))}</p><p>${esc(translation.adaptationNote)}</p></button>`}
function selectFactoryPattern(scope,id){if(scope==='client')state.factory.clientPatternId=id;else state.factory.universalPatternId=state.factory.universalPatternId===id?'':id;state.factory.structure=CORE.mergeStructures(state.factory.physicalType,factoryClientPattern(),factoryUniversalPattern());state.factory.coverage=[];saveState();renderPage()}

function factoryCandidateObject(id,title,angle){const client=factoryClient(),cp=factoryClientPattern(),up=factoryUniversalPattern(),units=state.factory.structure.map((s,i)=>({id:`u${i+1}`,label:s.name,function:s.function,text:`[Resultado IA pendiente · ${angle}]`,recording:'Definir según formato y speaker disponible.',visualDirection:`Aplicar ${client.name}: ${cp.visualRules||client.visualRules}`,broll:'Apoyo funcional, no stock genérico.',vfx:{name:'Contextual Materialize',simple:'Fade/scale sutil.',medium:'Parallax leve.',advanced:'Tracking solo si aporta.'},sfx:{sound:'no_sfx_needed',when:'Solo si existe evento visual.',trigger:'Evento visual real.',level:'Bajo voz.'},music:{style:'Editorial minimal',bpm:'72–90',when:'Duck bajo voz.'}}));return{id,clientId:client.id,title,physicalType:state.factory.physicalType,formatName:physicalTypeLabel(state.factory.physicalType),recipeClient:cp.name,recipeUniversal:up?.name||'',pillar:state.factory.pillar,intention:'Contenido generado desde He',audience:state.factory.audience,problem:state.factory.problem,desiredChange:state.factory.desiredChange,summary:`AI READY · ${angle}`,thesis:state.factory.desiredChange||angle,primaryPlatform:state.factory.primaryPlatform,platforms:[state.factory.primaryPlatform],lifecycle:'AI_READY',reviewState:'unreviewed',productionStatus:'pending',publicationStatus:'not_published',scheduledAt:null,publishedAt:null,lot:'L1',structure:deepClone(state.factory.structure),units,copies:{},promptInputs:{},prompts:{},qa:{claimsChecked:false,sourcesChecked:false,visualChecked:false},history:[{version:1,at:new Date().toISOString(),reason:'He v0.9.3',summary:`AI READY · ${angle}`}],expectedAssets:[],productionTasks:defaultTasks(id,state.factory.physicalType),relations:[],graph:{nodeType:'content',dependsOn:[],relations:[],futureProjection:{compatible:true}}}}
function renderPieceStep4(c){if(!state.factory.piecePackage.length)compileFactoryPiecePackage();return`<div class="eyebrow">PASO 4</div><h2>Prompts listos para ejecutar</h2><p style="font-size:10px;color:var(--muted)">Contenido y visual se mantienen separados. Puedes guardar las piezas como AI READY antes de ejecutarlas.</p><div class="coverage-list">${state.factory.piecePackage.map((p,i)=>`<article class="coverage-item"><div class="coverage-num">${pad(i+1)}</div><div><h4 style="margin:0 0 8px">${esc(p.content.title)}</h4><details class="disclosure"><summary>Prompt de contenido</summary><div class="disclosure-body"><div class="prompt-box">${esc(p.editorial)}</div><button class="btn xs" onclick="copyText(state.factory.piecePackage[${i}].editorial)">Copiar contenido</button></div></details><details class="disclosure" style="margin-top:6px"><summary>Prompt visual</summary><div class="disclosure-body"><div class="prompt-box">${esc(p.visual)}</div><button class="btn xs" onclick="copyText(state.factory.piecePackage[${i}].visual)">Copiar visual</button></div></details></div></article>`).join('')}</div><div style="margin-top:14px;display:flex;gap:7px"><button class="btn primary" onclick="saveFactoryPieces()">Guardar ${state.factory.piecePackage.length} AI READY</button><button class="btn" onclick="download('he_piece_package_v0.9.3.json',JSON.stringify(state.factory.piecePackage,null,2),'application/json')">Descargar JSON</button></div>`}

function expectedAssetsForNew(c){if(c.physicalType==='carousel')return Array.from({length:c.units.length},(_,i)=>({slotId:`slide-${pad(i+1)}`,kind:'image',relativePath:`assets/${c.clientId}/${c.id}/slides/slide-${pad(i+1)}.png`,status:'missing'}));if(['reel','horizontal'].includes(c.physicalType))return[{slotId:'master-video',kind:'video',relativePath:`assets/${c.clientId}/${c.id}/video/master.mp4`,status:'missing'},{slotId:'cover-a',kind:'image',relativePath:`assets/${c.clientId}/${c.id}/covers/cover-a.png`,status:'missing'}];return[{slotId:'hero',kind:'image',relativePath:`assets/${c.clientId}/${c.id}/images/hero.png`,status:'missing'}]}

function renderFactoryBatch(){const b=state.factory.batch,c=factoryClient();return`<section class="wizard-card"><div class="eyebrow">CREAR LOTE</div><h2>Una semana, dos semanas o un mes.</h2><p style="font-size:10px;color:var(--muted)">La ventana define cuántas semanas. Cada lote tiene su propia cadencia.</p><div class="grid cols-2" style="margin-top:12px"><div class="field"><label>Cliente</label><select onchange="setFactoryClient(this.value)">${state.data.clients.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Ventana</label><div class="segmented"><button class="${b.window==='1_week'?'active':''}" onclick="setBatchWindow('1_week')">1 semana</button><button class="${b.window==='2_weeks'?'active':''}" onclick="setBatchWindow('2_weeks')">2 semanas</button><button class="${b.window==='1_month'?'active':''}" onclick="setBatchWindow('1_month')">1 mes</button></div></div></div><label style="display:flex;gap:8px;align-items:center;font-size:10px;margin:12px 0"><input type="checkbox" style="width:auto" ${b.useExisting?'checked':''} onchange="setBatchReuse(this.checked)"> Usar contenido existente</label><div class="section-head"><div><h3>Cadencia por lote</h3><p>L1, L2 y L3 son independientes. Ejemplo válido: L1 Alta + L2 Media + L3 Baja.</p></div></div><div class="batch-grid">${renderLotCadence('lot1','Cadencia Lote 1','Principales / profundidad','Baja/Media: 1 Reel + 1 Carrusel principal por semana. Alta: 2 + 2.')}${renderLotCadence('lot2','Cadencia Lote 2','Derivados / frecuencia','Baja: 1 · Media: 2 · Alta: 3 contenidos por semana.')}${renderLotCadence('lot3','Cadencia Lote 3','Soporte / stories / simples','Baja: 1 · Media: 2 · Alta: 4 contenidos por semana.')}</div><div class="section-head"><div><h3>Pilares del cliente</h3><p>Los slots nuevos se reparten entre los pilares seleccionados.</p></div></div><div class="pillar-grid">${c.pillars.map(p=>`<button class="pill-choice ${b.pillar function editBatchConcept(id){const x=state.factory.batch.preview.find(s=>s.id===id);if(!x||x.status==='existing')return;const v=prompt('Concepto / enfoque del slot',x.concept);if(v!==null){x.concept=v;state.factory.batch.concepts[id]=v;saveState();renderPage()}}
function saveBatchToLibrary(){snapshotForUndo('Guardar lote He');const c=factoryClient();for(const slot of state.factory.batch.preview){if(slot.status==='existing')continue;const pat=c.patterns.find(p=>p.id===slot.patternId)||c.patterns[0],up=state.data.universalPatterns[0],structure=CORE.mergeStructures(slot.physicalType,pat,up),id=`${c.id}-batch-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,5)}`;const old={physicalType:state.factory.physicalType,clientPatternId:state.factory.clientPatternId,universalPatternId:state.factory.universalPatternId,structure:state.factory.structure,pillar:state.factory.pillar};state.factory.physicalType=slot.physicalType;state.factory.clientPatternId=pat.id;state.factory.universalPatternId=up.id;state.factory.structure=structure;state.factory.pillar=state.factory.batch.pillars[(slot.week+slot.lot.charCodeAt(1))%state.factory.batch.pillars.length];const content=factoryCandidateObject(id,slot.concept,`Lote ${slot.lot} · semana ${slot.week}`);content.lot=slot.lot;content.history[0].reason='He lote v0.9.3';content.prompts={editorial:CORE.compileEditorialPrompt(content,c,{physicalType:slot.physicalType,recipeClient:pat.name,recipeUniversal:up.name,structure}),visual:CORE.compileVisualPrompt(content,c,{physicalType:slot.physicalType})};content.expectedAssets=expectedAssetsForNew(content);state.data.contents.push(content);Object.assign(state.factory,old)}state.factory.batch.preview=[];state.ui.section='production';saveState();renderShell();toast('Lote guardado: contenido existente reutilizado + piezas nuevas AI READY')}

function renderProductionQueue(){if(state.ui.productionContentId)return renderProductionDetail();if(!state.ui.productionCategory)return`${screenContext('Production Queue','La cola abre por problema a resolver, no por una matriz de tareas.','elige una categoría y después una pieza')}<div class="section-head"><div><h3>¿Qué quieres resolver?</h3><p>La complejidad queda agrupada debajo.</p></div><button class="btn" onclick="setProductionCategory('all')">Ver todo</button></div><div class="production-category-grid">${PRODUCTION_CATEGORIES.map(([id,l,types])=>`<button class="production-category materialize" onclick="setProductionCategory('${id}')"><span class="count">${countProductionCategory(types)}</span><b>${l}</b><small>Resolver por categoría</small></button>`).join('')}</div>`;const cat=state.ui.productionCategory,types=cat==='all'?null:PRODUCTION_CATEGORIES.find(x=>x[0]===cat)?.[2],items=state.data.contents.filter(c=>(c.productionTasks||[]).some(t=>!['done','approved'].includes(t.status)&&(!types||types.includes(t.type))));return`${screenContext('Production Queue',cat==='all'?'Todas las tareas abiertas.':`${PRODUCTION_CATEGORIES.find(x=>x[0]===cat)?.[1]} · primero contenido, después una tarea.`,'abre una pieza y resuelve una tarea')}<button class="btn" onclick="setProductionCategory(null)">← Categorías</button><div class="production-list" style="margin-top:10px">${items.map(c=>`<article class="production-content"><div><div class="tag-row"><span class="tag client">${esc(getClient(c.clientId).name)}</span><span class="tag">${esc(physicalTypeLabel(c.physicalType))}</span></div><h4>${esc(c.title)}</h4><p>${(c.productionTasks||[]).filter(t=>!['done','approved'].includes(t.status)&&(!types||types.includes(t.type))).map(t=>t.label).join(' · ')}</p><div class="progress" style="margin-top:8px"><i style="width:${productionProgress(c)}%"></i></div></div><button class="btn primary" onclick="continueProduction('${c.id}')">Continuar producción →</button></article>`).join('')||'<div class="card"><p>No hay pendientes en esta categoría.</p></div>'}</div>`}
function countProductionCategory(types){return state.data.contents.reduce((n,c)=>n+(c.productionTasks||[]).filter(t=>!['done','approved'].includes(t.status)&&types.includes(t.type)).length,0)}
function setProductionCategory(v){state.ui.productionCategory=v;state.ui.productionContentId=null;saveState();renderPage()}
function continueProduction(id){state.ui.productionContentId=id;state.ui.productionTaskId=null;saveState();renderPage()}
function renderProductionDetail(){const c=getContent(state.ui.productionContentId),open=(c.productionTasks||[]).filter(t=>!['done','approved'].includes(t.status));const task=state.ui.productionTaskId?c.productionTasks.find(t=>t.id===state.ui.productionTaskId):open[0];return`${screenContext(c.title,`${physicalTypeLabel(c.physicalType)} · ${productionProgress(c)}% producción`,'resuelve una tarea y vuelve a la cola')}<button class="btn" onclick="state.ui.productionContentId=null;state.ui.productionTaskId=null;saveState();renderPage()">← Volver</button><div class="grid cols-2" style="margin-top:10px"><div class="card"><div class="eyebrow">Qué falta</div><div class="task-list" style="margin-top:8px">${(c.productionTasks||[]).map(t=>`<button class="task-card ${task?.id===t.id?'active':''}" onclick="selectProductionTask('${t.id}')"><div><b>${esc(t.label)}</b><p>${esc(t.description)}</p></div><span class="tag">${esc(t.status)}</span></button>`).join('')}</div></div><div class="card">${task?`<div class="eyebrow">Tarea actual</div><h3>${esc(task.label)}</h3><p style="font-size:10px;color:var(--muted)">${esc(task.description)}</p><details class="disclosure" open style="margin-top:10px"><summary>Prompt de la tarea</summary><div class="disclosure-body"><div class="prompt-box">${esc(CORE.makeTaskPrompt(c,task,getClient(c.clientId)))}</div><button class="btn xs" onclick="copyText(CORE.makeTaskPrompt(getContent('${c.id}'),getContent('${c.id}').productionTasks.find(t=>t.id==='${task.id}'),getClient('${c.clientId}')))">Copiar prompt</button></div></details><button class="btn primary" style="margin-top:10px" onclick="completeProductionTask('${c.id}','${task.id}')">Marcar resuelta</button><button class="btn" style="margin-top:10px" onclick="openStudio('${c.id}','production')">Abrir Content Studio</button>`:'<p>Todo resuelto.</p>'}</div></div>`}
function selectProductionTask(id){state.ui.productionTaskId=id;saveState();renderPage()}
function completeProductionTask(cid,tid){const t=getContent(cid).productionTasks.find(x=>x.id===tid);snapshotForUndo(`Completar ${t.label}`);t.status='done';saveState();renderPage();toast('Tarea resuelta')}

function renderShim(){const s=state.shim;if(!s.prompt)s.prompt=CORE.buildShimPrompt(s);return`${screenContext('Shim','Convierte transcripciones con timestamps en un paquete preciso para que otra IA genere candidatos, carruseles y Automation Handoff.','copia el prompt y reimporta el resultado')}<div class="grid cols-2"><div class="card"><div class="field"><label>Video / grabación</label><input value="${esc(s.sourceLabel)}" oninput="shimInput('sourceLabel',this.value)"></div><div class="field" style="margin-top:8px"><label>Contexto opcional</label><textarea oninput="shimInput('context',this.value)">${esc(s.context)}</textarea></div><div class="field" style="margin-top:8px"><label>Transcripción con timestamps</label><textarea style="min-height:300px" oninput="shimInput('transcript',this.value)">${esc(s.transcript)}</textarea></div><div class="grid cols-2" style="margin-top:8px"><div class="field"><label>Verticales</label><input type="number" min="0" max="50" value="${s.verticalCount}" oninput="shimInput('verticalCount',Number(this.value))"></div><div class="field"><label>Horizontales</label><input type="number" min="0" max="20" value="${s.horizontalCount}" oninput="shimInput('horizontalCount',Number(this.value))"></div></div><div class="field" style="margin-top:8px"><label>Estructura personalizada</label><textarea oninput="shimInput('customStructure',this.value)">${esc(s.customStructure)}</textarea></div></div><div class="card"><div class="eyebrow">Resultado para IA</div><h3>Prompt + contrato HTML/JSON</h3><div class="prompt-box" style="max-height:620px">${esc(CORE.buildShimPrompt(s))}</div><div style="margin-top:8px;display:flex;gap:7px"><button class="btn primary" onclick="copyText(CORE.buildShimPrompt(state.shim))">Copiar prompt</button><button class="btn" onclick="download('shim_prompt_v0.9.3.txt',CORE.buildShimPrompt(state.shim))">TXT</button></div></div></div>`}
function shimInput(k,v){state.shim[k]=v;state.shim.prompt=CORE.buildShimPrompt(state.shim);saveState();renderPage()}

function renderAiResults(){const candidates=state.data.contents.filter(c=>['AI_READY','AI_RESULT','REVIEW','PRODUCTION'].includes(c.lifecycle)),target=getContent(state.ui.aiMap.contentId);return`${screenContext('Resultados IA','Selecciona visualmente el destino antes de hidratar; el mismo content_id debe sobrevivir.','mapea una parte y luego abre Content Studio')}<div class="card"><div class="eyebrow">1 · ¿A qué contenido pertenece?</div><div class="destination-grid" style="margin-top:8px">${candidates.map(c=>`<button class="destination-card ${state.ui.aiMap.contentId===c.id?'active':''}" onclick="setAiDestination('${c.id}')"><span class="tag client">${esc(getClient(c.clientId).name)}</span><b>${esc(c.title)}</b><small>${esc(physicalTypeLabel(c.physicalType))} · ${esc(lifecycleLabel(c.lifecycle))}</small></button>`).join('')}</div></div><div class="grid cols-2" style="margin-top:10px"><div class="card"><div class="eyebrow">2 · ¿Qué estás trayendo de vuelta?</div><div class="segmented" style="margin:8px 0">${[['auto','Detectar'],['content','Guion / contenido'],['structure','Estructura'],['copies','Copies'],['visual','Producción visual'],['full','Paquete completo']].map(([v,l])=>`<button class="${state.ui.aiMap.part===v?'active':''}" onclick="setAiPart('${v}')">${l}</button>`).join('')}</div><textarea id="aiResultText" style="min-height:300px" placeholder="Pega aquí el JSON generado por IA."></textarea><button class="btn primary" style="margin-top:8px" onclick="hydrateAiResultManual()">Preview + hidratar</button></div><div class="card"><div class="eyebrow">Vista previa del mapeo</div><h3>${target?esc(target.title):'Selecciona una pieza'}</h3><p>${target?`${esc(getClient(target.clientId).name)} · ${esc(physicalTypeLabel(target.physicalType))} · parte ${esc(state.ui.aiMap.part)}`:'ABRAXAS no sobrescribe nada hasta que exista un destino explícito.'}</p></div></div>`}
function setAiDestination(id){state.ui.aiMap.contentId=id;saveState();renderPage()}
function setAiPart(v){state.ui.aiMap.part=v;saveState();renderPage()}
function hydrateAiResultManual(){const raw=document.getElementById('aiResultText').value;let r;try{r=JSON.parse(raw)}catch{alert('JSON inválido');return}const id=state.ui.aiMap.contentId||r.contentId;if(!id)return alert('Selecciona destino');const c=getContent(id),part=state.ui.aiMap.part==='auto'?(r.copies?'copies':r.units||r.structure?'content':'full'):state.ui.aiMap.part;snapshotForUndo(`Hidratar ${c.title}`);if(['content','full'].includes(part)){for(const k of ['title','summary','thesis','units'])if(r[k]!==undefined)c[k]=r[k]}if(['structure','full'].includes(part)&&r.structure)c.structure=r.structure;if(['copies','full'].includes(part)&&r.copies)c.copies=r.copies;if(['visual','full'].includes(part)){if(r.expectedAssets)c.expectedAssets=r.expectedAssets;if(r.prompts?.visual)c.prompts={...(c.prompts||{}),visual:r.prompts.visual}}c.lifecycle='AI_RESULT';c.reviewState='unreviewed';c.history.push({version:(c.history.at(-1)?.version||0)+1,at:new Date().toISOString(),reason:'Resultado IA v0.9.3',summary:`Parte importada: ${part}`});saveState();openStudio(c.id,'airesults')}

function renderAssets(){const target=getContent(state.ui.assetMap.contentId),slots=target?.expectedAssets||[];return`${screenContext('Assets','Cada archivo debe saber a qué content_id, unidad y slot pertenece.','selecciona destino, importa y vuelve a Content Studio')}<div class="card"><div class="eyebrow">Contenido destino</div><div class="destination-grid" style="margin-top:8px">${state.data.contents.map(c=>`<button class="destination-card ${state.ui.assetMap.contentId===c.id?'active':''}" onclick="setAssetDestination('${c.id}')"><span class="tag client">${esc(getClient(c.clientId).name)}</span><b>${esc(c.title)}</b><small>${esc(physicalTypeLabel(c.physicalType))}</small></button>`).join('')}</div></div><div class="grid cols-2" style="margin-top:10px"><div class="card"><div class="field"><label>Parte / slot</label><select onchange="state.ui.assetMap.slotId=this.value;saveState()"><option value="">Seleccionar slot…</option>${slots.map(s=>`<option value="${s.slotId}" ${state.ui.assetMap.slotId===s.slotId?'selected':''}>${esc(s.slotId)} · ${esc(s.relativePath)}</option>`).join('')}</select></div><div class="field" style="margin-top:8px"><label>Tipo</label><select onchange="state.ui.assetMap.kind=this.value;saveState()"><option>image</option><option>video</option><option>file</option></select></div><button class="btn primary" style="margin-top:10px" onclick="manualAssetImport()">Importar y vincular</button><p style="margin-top:10px">Ruta local recomendada: <code style="font-size:8px">assets/{client_id}/{content_id}/{asset_group}/{filename}</code></p></div><div class="card"><div class="eyebrow">Assets sin resolver</div><h3>Un archivo sin destino sigue fuera del sistema.</h3><p>ABRAXAS no debe fingir que una carpeta desordenada ya es una biblioteca. Mapea manualmente contenido + slot cuando la ruta no sea inequívoca.</p></div></div><div class="section-head"><div><h3>Biblioteca de assets</h3><p>${state.assets.length} registros vinculados.</p></div></div><div class="asset-grid">${state.assets.map(a=>`<article class="asset-card"><div class="asset-preview">${a.preview?`<img src="${a.preview}" style="max-width:100%;max-height:100%;object-fit:contain">`:'Asset'}</div><div class="asset-body"><b>${esc(a.name)}</b><code>${esc(a.path)}</code></div></article>`).join('')||'<div class="card"><p>Sin assets importados en esta sesión.</p></div>'}</div>`}
function setAssetDestination(id){state.ui.assetMap.contentId=id;state.ui.assetMap.slotId='';saveState();renderPage()}
function manualAssetImport(){const c=getContent(state.ui.assetMap.contentId),slot=(c?.expectedAssets||[]).find(s=>s.slotId===state.ui.assetMap.slotId);if(!c||!slot)return alert('Selecciona contenido y slot');const i=document.createElement('input');i.type='file';i.onchange=()=>{if(!i.files[0])return;const file=i.files[0],preview=file.type.startsWith('image/')?URL.createObjectURL(file):null;snapshotForUndo(`Vincular asset ${file.name}`);state.assets.push({id:uid('asset'),clientId:c.clientId,contentId:c.id,slotId:slot.slotId,name:file.name,path:slot.relativePath,preview});slot.status='ready';const task=(c.productionTasks||[]).find(t=>t.type==='visual'||t.type==='cover');if(task)task.status='done';saveState();renderPage();toast('Asset vinculado')};i.click()}

function renderBranding(){const c=getClient(state.ui.dashboardClient==='all'?'abraxas':state.ui.dashboardClient);return`${screenContext('Brand Intelligence','Brand Core resume la marca; Branding Method profundiza 25 herramientas por Driver.','abre una tool o crea contenido con el contexto resultante')}<div class="field" style="max-width:280px;margin-bottom:10px"><label>Cliente</label><select onchange="state.ui.dashboardClient=this.value;saveState();applyClientTheme(this.value);renderShell()">${state.data.clients.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="brand-core-grid">${[['Brand Core',c.brandCore.core],['Brand Identity',c.brandCore.identity],['Cómo explicarla',c.brandCore.clientExplanation],['Cómo venderla',c.brandCore.salesNarrative]].map(([a,b])=>`<article class="brand-chapter"><h4>${a}</h4><p>${esc(b)}</p></article>`).join('')}</div><div class="section-head"><div><h3>Branding Method · 25 tools</h3><p>Cada tool explica qué es, qué no es, pregunta, respuesta y prompt.</p></div></div>${renderBrandingDrivers(c)}`}
function renderBrandingDrivers(c){return state.data.brandingDrivers.map(d=>`<details class="driver"><summary>${esc(d.name)} · ${d.tools.length} tools</summary><div class="tools">${d.tools.map(t=>`<details class="tool"><summary>${esc(t.name)}</summary><div class="tool-body"><p><b>Qué es:</b> ${esc(t.whatIs)}</p><p><b>Qué no es:</b> ${esc(t.whatIsNot)}</p><p><b>Pregunta:</b> ${esc(t.question)}</p><p><b>Respuesta aplicada:</b> ${esc(t.answer)}</p><details class="disclosure"><summary>Prompt de la tool</summary><div class="disclosure-body"><div class="prompt-box">${esc(CORE.buildBrandToolPrompt(c,d,t))}</div><button class="btn xs" onclick="copyText(CORE.buildBrandToolPrompt(getClient('${c.id}'),state.data.brandingDrivers.find(x=>x.id==='${d.id}'),state.data.brandingDrivers.find(x=>x.id==='${d.id}').tools.find(x=>x.toolId==='${t.toolId}')))">Copiar prompt</button></div></details></div></details>`).join('')}</div></details>`).join('')}

function renderGuide(){return`${screenContext('Cómo usar ABRAXAS','Empieza por el resultado que quieres lograr; cada ruta explica exactamente dónde entrar y cómo cerrar el ciclo.','abre una ruta y usa Ir al paso')}<div class="guide-grid">${GUIDES.map((g,i)=>`<details class="guide-route"><summary>${esc(g.title)} <span>＋</span></summary><div class="guide-route-body"><div class="guide-steps">${Object.entries(g.steps).map(([k,v])=>`<div class="guide-step"><b>${k}</b><p>${esc(v)}</p></div>`).join('')}</div><div class="guide-step" style="margin-top:6px"><b>Ejemplo ABRAXAS</b><p>${esc(g.example)}</p></div><button class="btn primary" style="margin-top:8px" onclick="runGuide(${i})">Ir al paso →</button></div></details>`).join('')}</div>`}
function runGuide(i){const g=GUIDES[i];if(g.section==='library')applySavedView('today');else go(g.section)}

function renderRoadmap(){const selected=state.data.roadmap.find(x=>x.id===state.ui.roadmapNode)||state.data.roadmap[4],coords=[[80,300],[210,245],[350,205],[500,155],[650,105],[800,65]];return`${screenContext('Roadmap','Semilla → Raíces → Tronco → Ramas → Copa → Ecosistema. Cada nodo explica qué habilitó y qué sigue.','selecciona un nodo; P10 empieza después de estabilizar P9.3')}<div class="roadmap-tree"><div><svg viewBox="0 0 880 380" role="img" aria-label="Árbol de evolución ABRAXAS"><path d="M80 300 C160 285 180 255 210 245 C280 220 310 215 350 205 C420 190 450 170 500 155 C560 140 600 115 650 105 C720 90 760 75 800 65"/>${state.data.roadmap.map((x,i)=>{const[cx,cy]=coords[i];return`<g class="roadmap-node ${x.status==='current'?'current':''}" onclick="selectRoadmapNode('${x.id}')"><circle cx="${cx}" cy="${cy}" r="28"/><text x="${cx}" y="${cy-3}" text-anchor="middle">${esc(x.id)}</text><text class="sub" x="${cx}" y="${cy+12}" text-anchor="middle">${esc(x.name)}</text></g>`}).join('')}</svg></div><aside class="roadmap-inspector"><div class="eyebrow">${esc(selected.id)} · ${esc(selected.status)}</div><h3>${esc(selected.name)}</h3><p><b>${esc(selected.subtitle)}</b></p><p>${esc(selected.detail)}</p>${selected.id==='P9.3'?'<p><b>Gate actual:</b> Mac Spatial Dark, Client Intelligence, He pieza/lote, cadencias independientes, Calendar/Guide/Roadmap y Visual Regression.</p>':''}</aside></div>`}
function selectRoadmapNode(id){state.ui.roadmapNode=id;saveState();renderPage()}

function openSheet(title,body){state.ui.modal={title,body};renderFocusLayer()}
function closeSheet(){state.ui.modal=null;renderFocusLayer()}
function renderFocusLayer(){if(typeof document==='undefined')return;const el=document.getElementById('focusLayer');if(!el)return;if(state.ui.studioId)return renderStudioOverlay();if(!state.ui.modal){el.innerHTML='';return}el.innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeSheet()"><div class="sheet glass-layer materialize"><div class="sheet-head"><div><h3>${esc(state.ui.modal.title)}</h3><p>Información contextual; cierra para volver al punto de origen.</p></div><button class="btn icon" onclick="closeSheet()">×</button></div>${state.ui.modal.body}</div></div>`}
function toast(msg){if(typeof document==='undefined')return;const root=document.getElementById('toastStack');if(!root)return;const n=document.createElement('div');n.className='toast glass-layer materialize';n.textContent=msg;root.append(n);setTimeout(()=>n.remove(),2600);if(state.undo){const u=document.createElement('div');u.className='undo-bar glass-layer';u.innerHTML=`<span>${esc(state.undo.label)}</span><button class="btn xs" onclick="undoLast()">Deshacer</button>`;document.getElementById('focusLayer').append(u);setTimeout(()=>{if(u.isConnected)u.remove()},5000)}}
function afterRender(){document.addEventListener('keydown',e=>{if(e.key==='?'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();go('guide')}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&state.undo){e.preventDefault();undoLast()}})}
function afterRenderPage(){if(state.ui.section==='calendar')bindCalendarDnD();if(state.ui.studioId)renderStudioOverlay()}

function expectedAssetsForContent(c){return c.expectedAssets||[]}
function runVisualRegressionGate(){const issues=[];if(typeof document!=='undefined'){document.querySelectorAll('button').forEach(b=>{if(b.scrollWidth>b.clientWidth+4||b.scrollHeight>b.clientHeight+4)issues.push(`NO BUTTON COLLISIONS: ${b.textContent.trim().slice(0,30)}`)});document.querySelectorAll('.content-card h4,.client-card h3,.cal-item b').forEach(n=>{if(n.scrollWidth>n.clientWidth+6)issues.push(`NO TEXT OVERFLOW: ${n.textContent.slice(0,30)}`)})}return{pass:!issues.length,issues,markers:['WHERE AM I','WHAT CAN I DO','WHERE NEXT','NO GLASS ON GLASS','NO TEXT OVERFLOW','NO BUTTON COLLISIONS']}}

if(typeof document!=='undefined'){loadState();renderShell();}
if(typeof module!=='undefined'&&module.exports)module.exports={VERSION,state,monthCells,renderCalendar,renderDashboard,renderFactory,renderFactoryBatch,renderLotCadence,renderStudioContent,renderClientIntelligence,renderGuide,renderRoadmap,runVisualRegressionGate,contentMatchesView,productionProgress,physicalTypeLabel};
</script>
