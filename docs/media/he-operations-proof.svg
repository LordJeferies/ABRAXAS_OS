<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <rect width="600" height="320" fill="#0b0f17" rx="12"/>
  <rect x="20" y="20" width="560" height="40" fill="#141c2b" rx="6"/>
  <text x="35" y="45" fill="#10b981" font-family="-apple-system, monospace" font-size="13" font-weight="bold">HE OPERATIONS CORE — REAL-TIME TASK &amp; BLOCKER GRAPH</text>
  <rect x="500" y="28" width="70" height="24" fill="#10b981" rx="4"/>
  <text x="515" y="44" fill="#052e16" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">VERIFIED</text>

  <!-- 3 Column Kanban Sample -->
  <g transform="translate(20, 75)">
    <!-- Backlog -->
    <rect x="0" y="0" width="175" height="190" fill="#111827" stroke="#1f2937" rx="6"/>
    <text x="12" y="25" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">BACKLOG (3)</text>
    <rect x="10" y="40" width="155" height="40" fill="#1f2937" rx="4"/>
    <text x="20" y="64" fill="#e5e7eb" font-family="-apple-system, sans-serif" font-size="11">Script Brief v2</text>

    <!-- Blocked (Highlighted) -->
    <rect x="190" y="0" width="175" height="190" fill="#1e1b1b" stroke="#7f1d1d" rx="6"/>
    <text x="202" y="25" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">BLOCKED (1)</text>
    <rect x="200" y="40" width="155" height="50" fill="#450a0a" stroke="#dc2626" rx="4"/>
    <text x="210" y="60" fill="#fecaca" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">Voiceover Record</text>
    <text x="210" y="78" fill="#f87171" font-family="-apple-system, monospace" font-size="9">Blocked on Script Approval</text>

    <!-- In Progress -->
    <rect x="380" y="0" width="180" height="190" fill="#111827" stroke="#1f2937" rx="6"/>
    <text x="392" y="25" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">IN PROGRESS (2)</text>
    <rect x="390" y="40" width="160" height="40" fill="#1e293b" rx="4"/>
    <text x="400" y="64" fill="#e5e7eb" font-family="-apple-system, sans-serif" font-size="11">Rough Assembly Reel</text>
  </g>

  <text x="25" y="295" fill="#64748b" font-family="-apple-system, monospace" font-size="11">Deterministic Blocker Precedence | Multi-Reviewer Governance | Local Durability</text>
