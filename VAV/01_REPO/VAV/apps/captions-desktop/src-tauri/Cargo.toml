[package]
name = "abraxas-os"
version = "4.0.0"
description = "ABRAXAS OS — Intelligent Operating System"
authors = ["ABRAXAS"]
edition = "2021"

[lib]
name = "abraxas_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
