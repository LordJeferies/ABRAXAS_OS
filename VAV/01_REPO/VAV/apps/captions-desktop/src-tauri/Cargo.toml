[package]
name = "vav-captions"
version = "0.0.1"
description = "VAV Captions"
authors = ["VAV"]
edition = "2021"

[lib]
name = "vav_captions_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
